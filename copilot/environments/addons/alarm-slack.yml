# CloudWatch 알람 → Slack.
#
# ── 왜 따로 있나 ──────────────────────────────────────────────────────────
# log-slack-alerts.yml 은 **로그에 찍힌 글자**(ERROR·CRITICAL·Traceback)를 본다. 앱이 조용히
# 느려지거나 붙을 서버가 없어지면 로그에는 아무것도 안 남는다 — 2026-08-26 장애가 그랬다
# (동기 이미지 작업이 이벤트루프를 얼려 healthz 가 37초 공백, ALB 가 서버를 죽은 것으로 판정).
# 그건 **숫자**로만 보인다. 그래서 이 파일은 지표 알람을 건다.
#
# 램다를 하나 더 두는 이유: 기존 log-slack-alert 의 인라인 소스가 4,060/4,096 바이트라
# 여유가 36바이트다. 거기에 SNS 처리를 얹을 수 없다(그 파일 주석의 경고 그대로).
# 이쪽은 알람 JSON 한 개만 다루므로 훨씬 작다.
#
# ── 임계는 실측으로 잡았다 (2026-09-23, prod 3시간) ───────────────────────
#   요청 3,283건 · Target 5xx 0건 · TargetResponseTime p95 0.69초
#
# ── 2026-09-26 개정 (PR #414 와 그 사후 리뷰) ─────────────────────────────
#   9/25 에 울린 세 번이 모두 장애가 아니었다. 사진 업로드(장당 5~9초)가 p95 를 끌어올렸고,
#   기본 타깃그룹(타깃 0대)으로 떨어진 봇 요청이 ELB 503 을 채웠다. 그래서 이렇게 바꿨다.
#   ② slow-response 는 p95 대신 응답 중앙값을 보고, 응답 표본이 10건 이상인 5분만 센다.
#   ③ ELB 503 개수로 보던 "붙을 서버 없음"은 api 서비스 애드온(copilot/api/addons/api-alarms.yml)
#      의 정상 서버 수 알람으로 옮겼다. 타깃그룹 차원이 필요한데 그 타깃그룹은 서비스 스택이
#      만들어서 여기서는 지목할 수 없다.
#   ④ ELB 가 직접 만든 502·504 를 새로 본다. 앱이 응답하지 못한 경우인데 ① 에는 안 잡힌다.
#   60일 실측 대입과 남는 사각지대는 docs/runbooks/cloudwatch-alarms.md 에 있다.
#
# ── 못 건 것: ECS CPU ─────────────────────────────────────────────────────
#   AWS/ECS CPUUtilization 은 (ClusterName, ServiceName) 차원으로만 온다. 서비스 이름은
#   `wearless-use1-api-Service-QliObqw9TgGI` 처럼 뒤에 난수가 붙고 Copilot 이 export 하지 않아
#   환경 애드온에서 지목할 수가 없다(클러스터 차원만으로는 지표 자체가 안 온다 — 확인함).
#   포화는 응답시간으로 먼저 보인다(부하 실측: 65 rps 에서 CPU 17%, 응답 8ms) — 아래
#   TargetResponseTime 알람이 그 역할을 한다. 진짜 CPU 알람이 필요해지면 서비스 이름을
#   런타임에 찾아 알람을 만드는 커스텀 리소스가 필요하다.
#
# 되돌리기: copilot/api/addons/api-alarms.yml 이 이 파일의 토픽 export 를 가져다 쓰므로 그것부터
# 지워 api 를 배포한 뒤, 이 파일을 지우고 `copilot env deploy --name use1`. 순서가 바뀌면 export
# 가 사용 중이라 env 배포가 실패한다(docs/runbooks/cloudwatch-alarms.md 되돌리기 절).
Parameters:
  App:
    Type: String
  Env:
    Type: String

Resources:
  # 알람이 울 때 들어오는 창구. 알람 → SNS → 램다 → Slack.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${App}-${Env}-alarms'
      DisplayName: !Sub '${App} ${Env} alarms'

  AlarmSlackRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: alarm-slack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # 웹훅은 로그 알림과 같은 파라미터를 읽는다 — 채널도 같다.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/copilot/${App}/${Env}/secrets/SLACK_ALERT_WEBHOOK_URL'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${App}-${Env}-alarm-slack:*'

  # 램다가 자기 로그그룹을 스스로 만들면 보관기간이 '영구'로 잡힌다. 미리 만들어 14일로 둔다.
  AlarmSlackOwnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${App}-${Env}-alarm-slack'
      RetentionInDays: 14

  AlarmSlackFunction:
    Type: AWS::Lambda::Function
    DependsOn: AlarmSlackOwnLogGroup
    Properties:
      FunctionName: !Sub '${App}-${Env}-alarm-slack'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AlarmSlackRole.Arn
      Timeout: 20
      MemorySize: 256
      # 폭주 상한. 알람은 드물게 오지만 플래핑하면 연속으로 들어온다.
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          WEBHOOK_PARAM: !Sub '/copilot/${App}/${Env}/secrets/SLACK_ALERT_WEBHOOK_URL'
      Code:
        # ⚠️ 인라인 소스는 CloudFormation 한도가 4,096바이트다. 지금 여유가 넉넉하지만
        # 기능을 더 얹을 거면 그 한도를 먼저 확인할 것(log-slack-alerts.yml 이 그 한도에 걸렸다).
        ZipFile: |
          import json, os, urllib.request, urllib.error
          import boto3

          _cache = {}

          def _webhook():
              if "url" not in _cache:
                  ssm = boto3.client("ssm")
                  got = ssm.get_parameter(Name=os.environ["WEBHOOK_PARAM"], WithDecryption=True)
                  _cache["url"] = got["Parameter"]["Value"]
              return _cache["url"]

          def handler(event, context):
              for rec in event.get("Records", []):
                  try:
                      msg = json.loads(rec["Sns"]["Message"])
                  except Exception:
                      print("unparseable sns message")
                      continue
                  state = msg.get("NewStateValue", "")
                  # 새로 만든 알람의 첫 판정(INSUFFICIENT_DATA 에서 OK)은 복구가 아니다.
                  # 빈 데이터를 모두 따로 처리하는 알람들이라 INSUFFICIENT_DATA 는 생성 때만 생긴다.
                  if state == "OK" and msg.get("OldStateValue") == "INSUFFICIENT_DATA":
                      continue
                  # OK 로 돌아온 것도 보낸다 — 울고 끝나면 복구됐는지 사람이 모른다.
                  icon = ":rotating_light:" if state == "ALARM" else ":white_check_mark:"
                  name = msg.get("AlarmName", "(unnamed)")
                  desc = msg.get("AlarmDescription") or ""
                  reason = msg.get("NewStateReason", "")
                  region = msg.get("Region", os.environ.get("AWS_REGION", ""))
                  url = ("https://console.aws.amazon.com/cloudwatch/home?region=%s#alarmsV2:alarm/%s"
                         % (os.environ.get("AWS_REGION", ""), urllib.request.quote(name)))
                  blocks = [
                      {"type": "section", "text": {"type": "mrkdwn",
                       "text": "%s *%s* — %s" % (icon, name, state)}},
                  ]
                  if desc:
                      blocks.append({"type": "context", "elements": [
                          {"type": "mrkdwn", "text": desc}]})
                  blocks.append({"type": "context", "elements": [
                      {"type": "mrkdwn", "text": "```%s```" % reason[:900]}]})
                  blocks.append({"type": "actions", "elements": [
                      {"type": "button", "text": {"type": "plain_text", "text": "CloudWatch 에서 보기"},
                       "url": url}]})
                  body = json.dumps({
                      "text": "%s %s: %s (%s)" % (icon, name, state, region),
                      "blocks": blocks,
                  }).encode("utf-8")
                  req = urllib.request.Request(_webhook(), data=body,
                                               headers={"Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          resp.read()
                  except urllib.error.HTTPError as exc:
                      print("slack_post_failed status=%s body=%r" % (exc.code, exc.read()[:200]))

  AlarmSlackPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AlarmSlackFunction.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmTopic

  AlarmSlackSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: lambda
      Endpoint: !GetAtt AlarmSlackFunction.Arn

  # SNS 는 기본적으로 자기 계정의 알람만 받아도 되지만, 정책을 명시해 두지 않으면
  # CloudWatch 가 publish 하지 못하는 계정 설정이 있다.
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # ── 알람 셋 ───────────────────────────────────────────────────────────
  # 모두 LoadBalancer 차원만 쓴다. 타깃그룹 ARN 은 서비스 스택이 만들어서 환경 애드온이
  # 지목할 수 없다(확인함). LB 차원으로도 "사용자가 무엇을 받았나"는 다 보인다.
  # 타깃그룹이 필요한 정상 서버 알람은 copilot/api/addons/api-alarms.yml 에 있다.

  # ① 앱이 5xx 를 뱉는다 = 사용자가 에러 화면을 보는 중. 3시간 실측 0건이라 10 이면 확실한 신호.
  Alarm5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${App}-${Env}-target-5xx'
      AlarmDescription: '앱이 5xx 를 반환하고 있어요. 사용자가 에러 화면을 보는 중입니다.'
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !ImportValue
            'Fn::Sub': '${App}-${Env}-PublicLoadBalancerFullName'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # 트래픽이 없는 시간대에는 데이터포인트 자체가 없다. missing 을 정상으로 읽어야
      # 새벽마다 우는 걸 막는다.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # ② 서버 전체가 느려졌다. 평소 중앙값은 0.01~0.06초라 2초는 서른 배 넘게 위다.
  #    p95 가 아니라 중앙값을 보는 이유: 사진 업로드처럼 원래 몇 초 걸리는 요청은 꼬리만
  #    끌어올리고, 서버가 실제로 느려지면 모든 요청이 느려져 중앙값이 오른다.
  #    응답 표본이 10건 미만인 5분은 값을 내지 않는다(빈 값). 한 사람의 업로드 몇 장이 중앙값을
  #    정하는 한산한 시간을 거르려는 것이다. else 값을 0 으로 주면 아직 채워지는 중인 최신 5분이
  #    진짜 0 이 되어 연속 판정이 구간마다 끊긴다. 표본 수는 RequestCount 가 아니라 같은 지표의 SampleCount
  #    로 센다. 그래야 중앙값을 만든 요청 수와 어긋나지 않는다(502·504 로 끝난 요청은
  #    RequestCount 에만 들어간다).
  #    대가: 한산한 시간의 느려짐은 못 본다. 서버가 멈추면 api 의 정상 서버 알람이, 에러로
  #    번지면 ① 과 ④ 가 잡는다. 8/30 라이선스 발급 장애도 ① 이 21:50 에 먼저 잡았다.
  #    2회를 요구해 일시적 튐은 넘긴다. 이게 실제로 필요하다: 9/25 14:15 구간은 사진 20장
  #    업로드만으로 표본 10건 이상, 중앙값 2.64초였다(한 구간이라 안 울렸다). 다만 빈 구간은
  #    건너뛰고 최근 실제 값 두 개로 판정하므로, 가운데 빈 5분을 둔 업로드 몰림 두 번이 겹치면
  #    울 수 있다(60일 동안 15분 안에 두 번은 0회). 업로드 같은 느린 경로를 빼고 재는 근본
  #    해결은 앱이 직접 지표를 내야 한다(런북 사각지대 절).
  #    빈 데이터는 ignore(현재 상태 유지)다. notBreaching 이면 느려진 채로 요청이 줄어 표본이
  #    10건 밑으로 떨어질 때 서버가 여전히 느린데도 OK(복구)로 돌아간다.
  AlarmLatency:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${App}-${Env}-slow-response'
      AlarmDescription: '서버 전체가 느려졌어요(응답 중앙값 2초 초과가 10분). 일부 느린 요청이 아니라 대부분의 요청이 느린 상태입니다.'
      Metrics:
        - Id: n
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: TargetResponseTime
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue
                    'Fn::Sub': '${App}-${Env}-PublicLoadBalancerFullName'
            Period: 300
            Stat: SampleCount
        - Id: p50
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: TargetResponseTime
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue
                    'Fn::Sub': '${App}-${Env}-PublicLoadBalancerFullName'
            Period: 300
            Stat: p50
        - Id: slow
          Label: p50 response time when 10+ samples
          Expression: 'IF(n >= 10, p50)'
          ReturnData: true
      EvaluationPeriods: 2
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: ignore
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # ④ ELB 가 직접 만든 502·504. 앱이 응답하지 못했다는 뜻이다(502 는 응답 도중 연결이 끊김,
  #    504 는 유휴 타임아웃까지 응답 없음). 앱이 응답을 돌려준 것이 아니라서 ① 에는 안 잡힌다.
  #    503 은 봇이 기본 타깃그룹으로 떨어지며 늘 생겨서 뺐다. 60일 실측은 5분당 최대 1건
  #    (502 2건, 504 2건, 모두 따로 떨어져 있었다)이다. 3 으로 두면 우연히 겹친 한두 건은
  #    넘기고, 한가한 시간에 사용자 세 명이 막힌 경우는 잡는다.
  #    SUM([...]) 은 한쪽만 있는 5분은 그 값으로, 둘 다 없는 5분은 빈 값으로 둔다. FILL(…, 0) 은
  #    아직 지표가 안 온 최신 5분까지 진짜 0 으로 만들어 늦게 도착한 에러를 묻어 버려서 쓰지 않는다.
  AlarmElb5xx:
    Type: AWS::CloudWatch::Alarm
    # 새 알람의 첫 OK 를 거르는 램다 코드가 먼저 올라가야 Slack 에 가짜 '복구'가 안 간다.
    DependsOn: AlarmSlackFunction
    Properties:
      AlarmName: !Sub '${App}-${Env}-elb-502-504'
      AlarmDescription: '로드밸런서가 502·504 를 내고 있어요. 서버가 응답 도중 죽었거나, 응답하지 못하고 멈춘 상태입니다.'
      Metrics:
        - Id: e502
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_502_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue
                    'Fn::Sub': '${App}-${Env}-PublicLoadBalancerFullName'
            Period: 300
            Stat: Sum
        - Id: e504
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_504_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue
                    'Fn::Sub': '${App}-${Env}-PublicLoadBalancerFullName'
            Period: 300
            Stat: Sum
        - Id: bad
          Label: ELB 502 + 504
          Expression: 'SUM([e502, e504])'
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

Outputs:
  AlarmTopicArn:
    Description: 알람이 들어오는 SNS 토픽. 새 알람을 만들면 AlarmActions 에 이걸 준다.
    # copilot/api/addons/api-alarms.yml 이 ImportValue 로 쓴다. 이 export 를 지우거나 이름을
    # 바꾸면 env 배포가 막힌다(가져다 쓰는 스택이 있으면 CloudFormation 이 거부한다).
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub '${App}-${Env}-AlarmTopicArn'
