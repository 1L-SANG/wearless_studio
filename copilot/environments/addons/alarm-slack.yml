# CloudWatch 알람·예산 알림 → Slack 경로(SNS 토픽 + 램다). ALB 지표 알람은 0개, 지금 이 경로를 쓰는 건
# 아래 예산 알림 2개(MonthlyNetBudget·MonthlyGrossBudget, #451)다.
#
# ── 2026-10-02: ALB 지표 알람을 걷어냈다 ─────────────────────────────────
#   api 앞단이 ALB 에서 Cloudflare Tunnel 로 바뀌면서(설계
#   docs/superpowers/specs/2026-10-02-cloudflare-tunnel-ingress-design.md) 여기 있던 target-5xx·
#   slow-response·elb-502-504 와 api-no-healthy-target(copilot/api/addons/api-alarms.yml)이 지표
#   출처를 잃었다. 대체: 5xx 는 로그 알림(log-slack-alerts.yml 의 "http error status=5")이 건별로
#   잡고, 서버 0대·502/504 는 외부 업타임 모니터, 터널 끊김은 Cloudflare Tunnel Health Alert 가
#   본다(docs/runbooks/cloudflare-tunnel.md). 실트래픽 응답 중앙값은 사각지대로 남았다.
#   ⚠️ ALB 이름 export(환경 스택의 PublicLoadBalancer… 출력)를 다시 import 하지 말 것 — ALB 가 없는
#   환경에서 env 배포가 실패한다(server/tests/test_deploy_manifest_qc_flags.py 가 막는다).
#   이 주석에도 그 export 이름을 그대로 적지 않는다 — 가드가 문자열로 검사한다.
#
# ── 토픽·램다를 남기는 이유 ────────────────────────────────────────────────
#   예산 알림이 이 토픽 → 램다 → Slack 으로 온다(램다가 평문 예산 메시지도 처리한다). 다음 지표 알람
#   (예: 앱이 직접 내는 지연 지표)도 AlarmActions·OKActions 에 AlarmTopicArn export 를 주면 같은 채널로 온다.
#   sam·opendid 알림은 이 토픽이 아니라 copilot/api/addons/sam-autoscale.yml 의 SamAlertTopic 을 쓴다.
#
# 램다를 log-slack-alert 와 따로 두는 이유: 그쪽 인라인 소스가 4,060/4,096 바이트라 SNS 처리를
# 얹을 수 없다.
#
# 되돌리기: 이 파일을 지우면 예산 알림도 같이 사라진다. export 를 가져다 쓰는 스택이 있으면 그것부터
# 지운다(2026-10-02 기준 없음).
Parameters:
  App:
    Type: String
  Env:
    Type: String

Resources:
  # 알람이 울 때 들어오는 창구. 알람 → SNS → 램다 → Slack.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${App}-${Env}-alarms'
      DisplayName: !Sub '${App} ${Env} alarms'

  AlarmSlackRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: alarm-slack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # 웹훅은 로그 알림과 같은 파라미터를 읽는다 — 채널도 같다.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/copilot/${App}/${Env}/secrets/SLACK_ALERT_WEBHOOK_URL'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${App}-${Env}-alarm-slack:*'

  # 램다가 자기 로그그룹을 스스로 만들면 보관기간이 '영구'로 잡힌다. 미리 만들어 14일로 둔다.
  AlarmSlackOwnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${App}-${Env}-alarm-slack'
      RetentionInDays: 14

  AlarmSlackFunction:
    Type: AWS::Lambda::Function
    DependsOn: AlarmSlackOwnLogGroup
    Properties:
      FunctionName: !Sub '${App}-${Env}-alarm-slack'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AlarmSlackRole.Arn
      Timeout: 20
      MemorySize: 256
      # 폭주 상한. 알람은 드물게 오지만 플래핑하면 연속으로 들어온다.
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          WEBHOOK_PARAM: !Sub '/copilot/${App}/${Env}/secrets/SLACK_ALERT_WEBHOOK_URL'
      Code:
        # ⚠️ 인라인 소스는 CloudFormation 한도가 4,096바이트다. 지금 여유가 넉넉하지만
        # 기능을 더 얹을 거면 그 한도를 먼저 확인할 것(log-slack-alerts.yml 이 그 한도에 걸렸다).
        ZipFile: |
          import json, os, urllib.request, urllib.error
          import boto3

          _cache = {}

          def _webhook():
              if "url" not in _cache:
                  ssm = boto3.client("ssm")
                  got = ssm.get_parameter(Name=os.environ["WEBHOOK_PARAM"], WithDecryption=True)
                  _cache["url"] = got["Parameter"]["Value"]
              return _cache["url"]

          def _post(payload):
              req = urllib.request.Request(_webhook(), data=json.dumps(payload).encode("utf-8"),
                                           headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      resp.read()
              except urllib.error.HTTPError as exc:
                  print("slack_post_failed status=%s body=%r" % (exc.code, exc.read()[:200]))

          def handler(event, context):
              for rec in event.get("Records", []):
                  sns = rec["Sns"]
                  try:
                      msg = json.loads(sns["Message"])
                  except Exception:
                      msg = None
                  # 예산 알림(AWS Budgets)은 JSON 이 아니라 평문이다 — 제목·본문 그대로 보낸다.
                  if not isinstance(msg, dict) or "AlarmName" not in msg:
                      subject = sns.get("Subject") or "AWS 알림"
                      _post({"text": ":moneybag: *%s*\n```%s```" % (subject, sns["Message"][:1500])})
                      continue
                  state = msg.get("NewStateValue", "")
                  # 새로 만든 알람의 첫 판정(INSUFFICIENT_DATA 에서 OK)은 복구가 아니다.
                  # 빈 데이터를 모두 따로 처리하는 알람들이라 INSUFFICIENT_DATA 는 생성 때만 생긴다.
                  if state == "OK" and msg.get("OldStateValue") == "INSUFFICIENT_DATA":
                      print("skip first OK: %s" % msg.get("AlarmName"))
                      continue
                  # OK 로 돌아온 것도 보낸다 — 울고 끝나면 복구됐는지 사람이 모른다.
                  icon = ":rotating_light:" if state == "ALARM" else ":white_check_mark:"
                  name = msg.get("AlarmName", "(unnamed)")
                  desc = msg.get("AlarmDescription") or ""
                  reason = msg.get("NewStateReason", "")
                  region = msg.get("Region", os.environ.get("AWS_REGION", ""))
                  url = ("https://console.aws.amazon.com/cloudwatch/home?region=%s#alarmsV2:alarm/%s"
                         % (os.environ.get("AWS_REGION", ""), urllib.request.quote(name)))
                  blocks = [
                      {"type": "section", "text": {"type": "mrkdwn",
                       "text": "%s *%s* — %s" % (icon, name, state)}},
                  ]
                  if desc:
                      blocks.append({"type": "context", "elements": [
                          {"type": "mrkdwn", "text": desc}]})
                  blocks.append({"type": "context", "elements": [
                      {"type": "mrkdwn", "text": "```%s```" % reason[:900]}]})
                  blocks.append({"type": "actions", "elements": [
                      {"type": "button", "text": {"type": "plain_text", "text": "CloudWatch 에서 보기"},
                       "url": url}]})
                  _post({
                      "text": "%s %s: %s (%s)" % (icon, name, state, region),
                      "blocks": blocks,
                  })

  AlarmSlackPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AlarmSlackFunction.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmTopic

  AlarmSlackSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: lambda
      Endpoint: !GetAtt AlarmSlackFunction.Arn

  # SNS 는 기본적으로 자기 계정의 알람만 받아도 되지만, 정책을 명시해 두지 않으면
  # CloudWatch 가 publish 하지 못하는 계정 설정이 있다.
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # 문이 둘 이상이면 SNS 는 문마다 고유 Sid 를 요구한다(없으면 400 — 2026-10-02 롤백).
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
          # 예산 알림(아래 MonthlyNetBudget·MonthlyGrossBudget)도 같은 토픽으로 들어온다.
          - Sid: AllowBudgets
            Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # ── 예산 알림 (2026-10-02) ───────────────────────────────────────────────
  # 계정은 크레딧으로 굴러가는데 9월부터 크레딧이 ECS·ELB 만 덮어 나머지가 실제로 청구된다
  # (9월 실청구 $20.5, 크레딧 차감 전 총사용 $68.8). 비용이 튀어도 알려주는 곳이 없었다.
  # 예산은 계정 전역이라 리전과 무관하다. 알림은 위 AlarmTopic → 램다 → Slack 으로 간다.
  #   실청구(크레딧 반영): 월 $30 — 80%·100% 실제 도달, 100% 초과 예측.
  #   총사용(크레딧 차감 전): 월 $150 — 크레딧이 빨리 닳는지 본다.
  MonthlyNetBudget:
    Type: AWS::Budgets::Budget
    DependsOn: AlarmTopicPolicy
    Properties:
      Budget:
        BudgetName: !Sub '${App}-monthly-net'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 30, Unit: USD}
        CostTypes: {IncludeCredit: true, IncludeRefund: true}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref AlarmTopic}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref AlarmTopic}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref AlarmTopic}]

  MonthlyGrossBudget:
    Type: AWS::Budgets::Budget
    DependsOn: AlarmTopicPolicy
    Properties:
      Budget:
        BudgetName: !Sub '${App}-monthly-gross'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 150, Unit: USD}
        CostTypes: {IncludeCredit: false, IncludeRefund: false}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref AlarmTopic}]

Outputs:
  AlarmTopicArn:
    Description: 알람이 들어오는 SNS 토픽. 새 알람을 만들면 AlarmActions 에 이걸 준다.
    # 2026-10-02 기준 가져다 쓰는 스택은 없다(api-alarms.yml 삭제). 누군가 ImportValue 로 쓰기
    # 시작하면 이 export 를 지우거나 이름을 바꿀 때 env 배포가 막힌다.
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub '${App}-${Env}-AlarmTopicArn'
