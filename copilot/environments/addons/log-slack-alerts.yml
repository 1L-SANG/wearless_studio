# 크리티컬 앱 로그 → Slack 알림 (2026-09-01)
#
# CloudWatch Logs SubscriptionFilter 가 ERROR/CRITICAL/Traceback 줄만 골라 Lambda 로 보내고,
# Lambda 가 Slack Incoming Webhook 으로 **로그 본문 그대로** 던진다.
#
# 대상은 api · detail-worker · sam2 세 그룹이다. opendid 는 부팅 소음이 심해 제외했다
# (아래 "opendid 에는 일부러 붙이지 않는다" 블록에 근거와 되돌리는 법).
#
# 왜 CloudWatch 알람(SNS→Chatbot)이 아니라 이 구조인가:
#   알람은 "에러 N건 발생"까지만 알려주고 무슨 에러인지는 콘솔에 다시 들어가야 안다.
#   장애 때 필요한 건 카운트가 아니라 첫 줄이라 구독 필터 경로를 쓴다.
# 왜 앱 안에서 직접 Slack POST 하지 않는가:
#   (1) 동기 HTTP 가 이벤트루프를 얼린 사고 이력(2026-08-26 ALB 장애)
#   (2) OOM·태스크 킬로 프로세스가 죽으면 그 로그는 영영 안 나간다 — 컨테이너 밖에서 잡아야 한다
#
# ── 비용 ──
#   구독 필터 = 무과금. Lambda 는 256MB × ~0.3s, 월 수천 호출이라 프리티어(400,000 GB-s) 안.
#   ECS 태스크는 이 경로에 관여하지 않으므로 서버비 증가는 0.
#   유일한 상방 리스크는 로그 폭주인데 ReservedConcurrentExecutions=2 로 상한을 박아
#   최악(한 달 내내 풀가동)에도 $5 미만이다. 이 값을 지우면 상한이 사라진다.
#
# ── 배포 전 1회 준비 ──
#   1) Slack 워크스페이스에서 앱 생성 → Incoming Webhooks 켜고 대상 채널의 Webhook URL 발급
#   2) 그 URL 을 SecureString 으로 저장:
#        aws ssm put-parameter --region us-east-1 --profile wearless \
#          --name /copilot/wearless/use1/secrets/SLACK_ALERT_WEBHOOK_URL \
#          --type SecureString --value 'https://hooks.slack.com/services/...'
#      (이 파라미터는 ECS 태스크가 읽는 시크릿이 아니라 Lambda 가 직접 읽으므로
#       copilot 태그가 필요 없다 — 2026-07-17 태그 누락 사고와는 다른 경로다.)
#   3) copilot-aws env deploy --name use1
#
# ── 상태코드·경로는 어디서 오나 ──
#   main.py 의 http_error_log 미들웨어가 실패 응답마다
#     http error status=500 method=POST path=/v1/... duration_ms=1203 trace=Root=1-...
#   를 남기고, Lambda 의 CTX 정규식이 그중 status/method/path 를 Slack 헤더로 끌어올린다.
#   그 미들웨어가 없으면 5xx 중 **파이썬 예외가 터진 것만** 로그가 남아, 의도해서 돌려준
#   HTTPException 5xx(503 payment_not_configured 등)는 알림이 아예 가지 않았다.
#   4xx 는 그 미들웨어가 WARNING 으로 남긴다 -- 아래 FilterPattern 이 WARNING 을 보지 않으므로
#   CloudWatch 에는 남되 Slack 은 조용하다(만료 토큰·오탈자 URL 로 채널이 죽지 않게).
#
# ── 알아둘 제약 ──
#   * 로그가 평문 포맷(main.py _ExtraFormatter)이라 필터가 substring 매칭이다. 오탐이 보이면
#     FilterPattern 을 조이거나 DENY 에 추가하면 되고, 둘 다 앱 재배포는 필요 없다
#     (CloudWatch 필터 패턴에는 NOT 이 없어서 제외는 DENY 쪽에서 한다).
#   * 파이썬 트레이스백은 CloudWatch 에서 줄마다 별개 이벤트라 구독 필터는 헤더 줄만 준다.
#     그래서 Lambda 가 원본 스트림의 직후 구간을 직접 읽어 프레임을 메시지에 붙이고,
#     "CloudWatch 에서 보기" 버튼으로 그 스트림·시각 구간 딥링크도 같이 단다. 스택 조회가
#     실패해도 알림은 그대로 나간다(스택만 빠짐).
#   * SubscriptionFilter 가 **서비스 스택이 만든 로그 그룹**을 이름으로 참조한다. `svc delete`
#     후 재생성처럼 로그 그룹이 지워졌다 다시 생기면 이 env 스택을 다시 배포해야 필터가 붙는다.
Parameters:
  App:
    Type: String
  Env:
    Type: String

Resources:
  # ─────────────────────────── Lambda ───────────────────────────
  LogSlackAlertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LogSlackAlert
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${App}-${Env}-log-slack-alert:*'
              - Sid: ReadWebhook
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/copilot/${App}/${Env}/secrets/SLACK_ALERT_WEBHOOK_URL'
              # 트레이스백 프레임을 원본 스트림에서 직접 읽기 위한 읽기 전용 권한.
              # 구독 필터는 헤더 줄만 보내주므로(줄마다 별개 이벤트) 이게 없으면 스택을 못 붙인다.
              - Sid: ReadSourceLogs
                Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/copilot/${App}-${Env}-*:*'
              # SecureString 복호화. aws/ssm 관리형 키라 ViaService 조건으로 SSM 경유만 허용한다.
              - Sid: DecryptViaSsm
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  # Lambda 가 알아서 만들게 두면 retention 이 무한이라 명시적으로 만든다(이름 규약 고정).
  LogSlackAlertOwnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${App}-${Env}-log-slack-alert'
      RetentionInDays: 14

  LogSlackAlertFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogSlackAlertOwnLogGroup
    Properties:
      FunctionName: !Sub '${App}-${Env}-log-slack-alert'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LogSlackAlertRole.Arn
      Timeout: 20
      # 128 은 실측에서 빠듯했다(2026-09-01 스모크: Max Memory Used 95MB/128MB = 74%).
      # boto3 임포트만으로 그만큼이고 큰 배치가 오면 gzip 해제 + json 파싱이 그 위에 얹힌다.
      # 256 은 CPU 도 같이 늘어 실행이 짧아지므로 GB-s 는 거의 그대로다(둘 다 프리티어 안).
      MemorySize: 256
      # 폭주 상한. 이 줄이 비용 가드다 — 지우면 상한이 없어진다.
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          WEBHOOK_PARAM: !Sub '/copilot/${App}/${Env}/secrets/SLACK_ALERT_WEBHOOK_URL'
          # 로그 그룹명에서 서비스명만 떼어내는 접두사 (/copilot/wearless-use1-api → api)
          GROUP_PREFIX: !Sub '/copilot/${App}-${Env}-'
          # 레벨은 ERROR 인데 장애가 아닌 줄을 여기서 뺀다(`|` 구분, 부분일치).
          # CloudWatch 필터 패턴에는 NOT 이 없어서 제외는 Lambda 에서 할 수밖에 없다.
          # 새 소음이 보이면 이 줄에 추가하고 env 만 재배포하면 된다(앱 재배포 무관).
          #
          # 지금 값 둘은 opendid 부팅 로그다. opendid 는 알림 대상에서 빠졌으니 당장은
          # 매칭될 일이 없고, 나중에 다시 붙일 때를 위해 남겨둔다.
          DENY: 'Wallet already exists|FCM configuration is missing'
      Code:
      # ⚠️ 인라인 소스는 CloudFormation 한도가 4,096바이트다. 지금 4,060바이트로 여유가
      # 36바이트뿐이다 -- **다음 기능 추가는 S3 패키지 전환이 먼저다.** 식별자를 더 줄여
      # 밀어넣지 마라(그러다 GROUP_PREFIX·AWS_REGION 환경변수 이름까지 줄여서 임포트가
      # KeyError 로 죽을 뻔했다). 코드 안에 주석을 두지 않는 이유도 이 한도이고, 한글은
      # 3바이트/자라 특히 비싸다. 요지는 여기에 적는다.
      #
      #  DENY / CTX: DENY 는 레벨만 ERROR 인 정상 로그를 빼는 부분일치 목록(환경변수라
      #              문자열 길이는 이 한도에 안 들어간다). CTX 는 앱이 남긴
      #              `status=NNN method=X path=Y` 를 뽑아 Slack 헤더로 끌어올린다 --
      #              본문에도 그대로 있지만 헤더에 있어야 눈에 띈다.
      #  _stack()  : 파이썬 트레이스백은 CloudWatch 에서 줄마다 별개 이벤트라 구독 필터가
      #              헤더 줄만 보낸다. 프레임까지 붙이려고 같은 스트림의 직후 20초를 직접 읽고,
      #              다음 로그 레코드(날짜로 시작하는 줄)를 만나면 멈춘다. 실패해도 알림 자체는
      #              그대로 나간다(스택만 빠짐).
      #  _url()    : CloudWatch 콘솔 딥링크는 URL 인코딩 후 % 를 $25 로 한 번 더 바꾼
      #              형식을 쓴다(`/` -> `$252F`). 조각 뒤 쿼리도 $3F/$3D/$26 로 이스케이프한다.
      #  버튼      : url 버튼이라 Slack 앱 interactivity 설정 없이 그냥 링크가 열린다.
      #  _webhook(): 웜 컨테이너에서 재사용 -> SSM 호출은 콜드스타트당 1회.
      #  KST       : 컨테이너 TZ 가 UTC 라 헤더에 KST 를 병기한다. 로그 본문 포맷을 파싱하지
      #              않고 CloudWatch 이벤트의 epoch ms 를 쓰므로 어느 포맷이 와도 정확하다.
        ZipFile: |
          import base64, gzip, json, os, re
          import urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          import boto3

          PFX = os.environ["GROUP_PREFIX"]
          MAXL = 5
          RGN = os.environ["AWS_REGION"]
          KST = timezone(timedelta(hours=9))
          TBH = "Traceback (most recent call last)"
          DENY = [s for s in os.environ.get("DENY", "").split("|") if s]
          CTX = re.compile(r"status=(\d{3}) method=(\S+) path=(\S+)")
          _hook = None
          _logs = None

          def _webhook():
              global _hook
              if _hook is None:
                  _hook = boto3.client("ssm").get_parameter(
                      Name=os.environ["WEBHOOK_PARAM"], WithDecryption=True
                  )["Parameter"]["Value"]
              return _hook

          def _enc(v):
              return urllib.parse.quote(v, safe="").replace("%", "$25")

          def _url(group, stream, start, end):
              return (
                  "https://%s.console.aws.amazon.com/cloudwatch/home?region=%s"
                  "#logsV2:log-groups/log-group/%s/log-events/%s$3Fstart$3D%d$26end$3D%d"
                  % (RGN, RGN, _enc(group), _enc(stream), start, end)
              )

          def _stack(group, stream, start):
              global _logs
              if _logs is None:
                  _logs = boto3.client("logs")
              r = _logs.get_log_events(
                  logGroupName=group, logStreamName=stream, startTime=start,
                  endTime=start + 20000, limit=80, startFromHead=True,
              )
              out, hit = [], False
              for e in r.get("events", []):
                  m = e["message"].rstrip()
                  if not hit:
                      hit = TBH in m
                      if hit:
                          out.append(m)
                      continue
                  if m[:4].isdigit() and m[4:5] == "-":
                      break
                  out.append(m)
                  if len(out) >= 40:
                      break
              return out

          def _sec(text):
              return {"type": "section", "text": {"type": "mrkdwn", "text": text}}

          def handler(event, _context):
              payload = json.loads(gzip.decompress(base64.b64decode(event["awslogs"]["data"])))
              group = payload["logGroup"]
              stream = payload.get("logStream") or ""
              events = [e for e in payload.get("logEvents") or []
                        if not any(d in e["message"] for d in DENY)]
              if not events:
                  return

              svc = group[len(PFX):] if group.startswith(PFX) else group
              shown = []
              for e in events[:MAXL]:
                  m = e["message"].strip()
                  shown.append(m[:900] + " ..." if len(m) > 900 else m)
              body = "\n".join(shown)
              hidden = len(events) - len(shown)
              if hidden > 0:
                  body += "\n... +%d more in this batch" % hidden

              ctx = ""
              for e in events:
                  g = CTX.search(e["message"])
                  if g:
                      ctx = "\n*HTTP %s*  `%s %s`" % g.groups()
                      break

              first, last = events[0]["timestamp"], events[-1]["timestamp"]
              at = datetime.fromtimestamp(first / 1000, KST)
              blocks = [
                  _sec(":rotating_light: *%s* - %d error log(s)%s\n%s KST (%s UTC)\n`%s`" % (
                      svc, len(events), ctx, at.strftime("%Y-%m-%d %H:%M:%S"),
                      at.astimezone(timezone.utc).strftime("%H:%M:%S"), group)),
                  _sec("```%s```" % body[:2800]),
              ]
              if stream and any(TBH in e["message"] for e in events):
                  try:
                      tb = _stack(group, stream, first - 2000)
                  except Exception as exc:
                      tb = []
                      print("stack_fail %r" % (exc,))
                  if tb:
                      blocks.append(_sec("*stack*\n```%s```" % "\n".join(tb)[:2800]))
              if stream:
                  blocks.append({"type": "actions", "elements": [{
                      "type": "button",
                      "text": {"type": "plain_text", "text": "CloudWatch 에서 보기"},
                      "url": _url(group, stream, first - 60000, last + 60000),
                  }]})

              req = urllib.request.Request(
                  _webhook(),
                  data=json.dumps({
                      "text": ":rotating_light: %s: %d error log(s)" % (svc, len(events)),
                      "blocks": blocks,
                  }).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      resp.read()
              except urllib.error.HTTPError as exc:
                  print("slack_post_failed status=%s body=%r" % (exc.code, exc.read()[:200]))
  # ─────────────────────── 구독 필터 (서비스별) ───────────────────────
  # FilterPattern 해설: 텍스트 패턴에서 `?` 는 OR.
  #   " ERROR " / " CRITICAL " -> 앱 포맷 `<시각> <레벨> <로거> <메시지>` 의 레벨 토큰.
  #                                앞뒤 공백이 메시지 본문 안의 같은 단어 오탐을 줄인다.
  #   "ERROR:" / "CRITICAL:"   -> uvicorn 자체 로거 포맷(`ERROR:    ...`). 앱 포맷과 달라서 별도.
  #   "Traceback"              -> 스택 헤더 줄.
  # WARNING 은 일부러 뺐다 -- 켜면 fail-open 경로(SAM/QC 스킵)가 상시로 울려서 채널이 죽는다.
  LogSlackAlertPermissionApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LogSlackAlertFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/copilot/${App}-${Env}-api:*'

  LogSlackAlertFilterApi:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: LogSlackAlertPermissionApi
    Properties:
      LogGroupName: !Sub '/copilot/${App}-${Env}-api'
      DestinationArn: !GetAtt LogSlackAlertFunction.Arn
      FilterPattern: '?" ERROR " ?" CRITICAL " ?"ERROR:" ?"CRITICAL:" ?"Traceback"'

  LogSlackAlertPermissionDetailWorker:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LogSlackAlertFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/copilot/${App}-${Env}-detail-worker:*'

  LogSlackAlertFilterDetailWorker:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: LogSlackAlertPermissionDetailWorker
    Properties:
      LogGroupName: !Sub '/copilot/${App}-${Env}-detail-worker'
      DestinationArn: !GetAtt LogSlackAlertFunction.Arn
      FilterPattern: '?" ERROR " ?" CRITICAL " ?"ERROR:" ?"CRITICAL:" ?"Traceback"'

  # opendid(fm-holder)에는 **일부러 구독 필터를 붙이지 않는다**(2026-09-01 오너 결정).
  #
  # 이 서비스는 한 컨테이너에 스프링 앱 4개(cas·Issuer·Tas·fm-holder)가 뜨고, 그 부팅
  # 로그가 레벨만 ERROR 인 정상 줄을 매번 남긴다(Wallet already exists SSDKWLT02030,
  # FCM configuration is missing). 게다가 scale-to-zero 라 깰 때마다 그게 반복돼서,
  # 실측(1시간 10줄)상 opendid 가 소음의 **단독 발생원**이었다. 같은 창에서 api·
  # detail-worker·sam2 는 24시간 0줄이다.
  #
  # 자바 로그를 유의미하게 거르려면 정상 부팅 줄을 하나하나 DENY 에 넣어야 하는데,
  # 그건 opendid 이미지가 바뀔 때마다 깨지는 관리 부채다. 알림 대상에서 빼는 쪽이 싸다.
  #
  # ⚠️ 대가: opendid 쪽 실패는 Slack 에 오지 않는다. VC 발급·폐기 문제는 CloudWatch 에서
  # 직접 보거나, 그 실패를 호출자인 api 가 로그로 남기게 만들어야 한다(api 는 여전히 알림 대상).
  # 되돌리려면 위 Api 블록을 복사해 opendid 로 바꾸고 DENY 에 부팅 줄을 채운다.

  LogSlackAlertPermissionSam2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LogSlackAlertFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/copilot/${App}-${Env}-sam2:*'

  LogSlackAlertFilterSam2:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: LogSlackAlertPermissionSam2
    Properties:
      LogGroupName: !Sub '/copilot/${App}-${Env}-sam2'
      DestinationArn: !GetAtt LogSlackAlertFunction.Arn
      FilterPattern: '?" ERROR " ?" CRITICAL " ?"ERROR:" ?"CRITICAL:" ?"Traceback"'

Outputs:
  LogSlackAlertFunctionName:
    Description: 크리티컬 로그를 Slack 으로 중계하는 Lambda
    Value: !Ref LogSlackAlertFunction
