# api 트래픽 대시보드 — AWS 콘솔 CloudWatch → 대시보드 → wearless-use1-api-traffic.
#
# 2026-09-26 실트래픽 분석에서 "어느 API 가 몇 ms 인가"를 잴 수 없다는 게 드러났다. 성공 요청의
# 소요시간이 어디에도 안 남았고(실패만 duration_ms) ALB 액세스 로그는 꺼져 있었다. 그래서
# app/main.py 의 http_error_log 미들웨어가 요청마다 한 줄을 남기게 했고(route 는 라우트 틀,
# duration_ms, 4xx 면 에러 코드), 이 대시보드가 그 줄을 Logs Insights 로 집계한다.
#
# 서비스 애드온이라 api 배포(CI)에 같이 실려 간다 — env deploy 가 필요 없다.
#
# ECS CPU·메모리는 검색식(SEARCH)으로 그린다. 서비스 이름에 난수가 붙는데, 그걸
# addons.parameters.yml 로 받으면(!GetAtt Service.Name) 순환 참조가 된다 — 서비스 스택이 이미
# 애드온 출력(SamAlertTopicArn·SamAutoscalePolicyArn)을 쓰고 있어서다(2026-09-26 svc package 로 확인).
# 대시보드는 알람과 달리 검색식을 허용하므로 서비스별 선을 한 차트에 그린다.
#
# 본문은 배포 전에 실제 CloudWatch PutDashboard 로 검증했다(ValidationMessages 0건).
# 로그 쿼리 네 개도 실제 로그 그룹에서 돌려 문법·숫자 비교를 확인했다.
#
# 되돌리기: 이 파일을 지우고 api 를 배포하면 대시보드만 사라진다. 로그 줄은 main.py 쪽이다.
Parameters:
  App:
    Type: String
  Env:
    Type: String
  Name:
    Type: String
  # addons.parameters.yml 이 서비스 스택의 TargetGroup 에서 넘겨준다(api-alarms.yml 과 공유).
  TargetGroupFullName:
    Type: String

Resources:
  ApiTrafficDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${App}-${Env}-${Name}-traffic'
      DashboardBody: !Sub
        - |
          {
           "widgets": [
            {
             "type": "text",
             "x": 0,
             "y": 0,
             "width": 24,
             "height": 2,
             "properties": {
              "markdown": "## api 트래픽\n위 줄은 ALB·ECS 지표(5분 단위), 아래 표는 api 가 요청마다 남기는 `http request` 로그(라우트 틀·소요 ms·에러 코드)를 Logs Insights 로 집계한 것. 기간은 오른쪽 위에서 바꾼다. 헬스체크·OPTIONS 는 빠져 있다. 사용자 체감 지연에는 한국↔us-east-1 왕복 ~200ms 가 더해진다."
             }
            },
            {
             "type": "metric",
             "x": 0,
             "y": 2,
             "width": 8,
             "height": 6,
             "properties": {
              "title": "요청 수 · 4xx · 5xx (5분 합)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "period": 300,
              "metrics": [
               [
                "AWS/ApplicationELB",
                "RequestCount",
                "LoadBalancer",
                "${LoadBalancerFullName}",
                "TargetGroup",
                "${TargetGroupFullName}",
                {
                 "label": "요청"
                }
               ],
               [
                "AWS/ApplicationELB",
                "HTTPCode_Target_4XX_Count",
                "LoadBalancer",
                "${LoadBalancerFullName}",
                "TargetGroup",
                "${TargetGroupFullName}",
                {
                 "label": "4xx"
                }
               ],
               [
                "AWS/ApplicationELB",
                "HTTPCode_Target_5XX_Count",
                "LoadBalancer",
                "${LoadBalancerFullName}",
                "TargetGroup",
                "${TargetGroupFullName}",
                {
                 "label": "5xx"
                }
               ]
              ],
              "stat": "Sum"
             }
            },
            {
             "type": "metric",
             "x": 8,
             "y": 2,
             "width": 8,
             "height": 6,
             "properties": {
              "title": "서버 응답시간 (초)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "period": 300,
              "metrics": [
               [
                "AWS/ApplicationELB",
                "TargetResponseTime",
                "LoadBalancer",
                "${LoadBalancerFullName}",
                "TargetGroup",
                "${TargetGroupFullName}",
                {
                 "stat": "p50",
                 "label": "p50"
                }
               ],
               [
                "AWS/ApplicationELB",
                "TargetResponseTime",
                "LoadBalancer",
                "${LoadBalancerFullName}",
                "TargetGroup",
                "${TargetGroupFullName}",
                {
                 "stat": "p95",
                 "label": "p95"
                }
               ],
               [
                "AWS/ApplicationELB",
                "TargetResponseTime",
                "LoadBalancer",
                "${LoadBalancerFullName}",
                "TargetGroup",
                "${TargetGroupFullName}",
                {
                 "stat": "p99",
                 "label": "p99"
                }
               ]
              ]
             }
            },
            {
             "type": "metric",
             "x": 16,
             "y": 2,
             "width": 8,
             "height": 6,
             "properties": {
              "title": "CPU · 메모리 (서비스별 최대 %)",
              "region": "${AWS::Region}",
              "view": "timeSeries",
              "stacked": false,
              "period": 300,
              "metrics": [
               [
                {
                 "expression": "SEARCH('{AWS/ECS,ClusterName,ServiceName} MetricName=\"CPUUtilization\"', 'Maximum', 300)",
                 "id": "cpu",
                 "label": "CPU"
                }
               ],
               [
                {
                 "expression": "SEARCH('{AWS/ECS,ClusterName,ServiceName} MetricName=\"MemoryUtilization\"', 'Maximum', 300)",
                 "id": "mem",
                 "label": "MEM"
                }
               ]
              ],
              "yAxis": {
               "left": {
                "min": 0,
                "max": 100
               }
              }
             }
            },
            {
             "type": "log",
             "x": 0,
             "y": 8,
             "width": 24,
             "height": 8,
             "properties": {
              "title": "경로별 호출 수 · 응답시간 (ms)",
              "region": "${AWS::Region}",
              "view": "table",
              "query": "SOURCE '${LogGroup}' | filter @message like /http request status=/ | parse @message /status=(?<status>[0-9]+) method=(?<method>[A-Z]+) route=(?<route>[^ ]+) duration_ms=(?<ms>[0-9]+) code=(?<code>[^ ]+)/ | stats count(*) as calls, pct(ms, 50) as p50_ms, pct(ms, 95) as p95_ms, max(ms) as max_ms by method, route | sort calls desc | limit 50"
             }
            },
            {
             "type": "log",
             "x": 0,
             "y": 16,
             "width": 12,
             "height": 8,
             "properties": {
              "title": "느린 경로 (5회 이상, p95 순)",
              "region": "${AWS::Region}",
              "view": "table",
              "query": "SOURCE '${LogGroup}' | filter @message like /http request status=/ | parse @message /status=(?<status>[0-9]+) method=(?<method>[A-Z]+) route=(?<route>[^ ]+) duration_ms=(?<ms>[0-9]+) code=(?<code>[^ ]+)/ | stats count(*) as calls, pct(ms, 95) as p95_ms, pct(ms, 99) as p99_ms by method, route | filter calls >= 5 | sort p95_ms desc | limit 20"
             }
            },
            {
             "type": "log",
             "x": 12,
             "y": 16,
             "width": 12,
             "height": 8,
             "properties": {
              "title": "실패한 요청 (경로 · 에러 코드)",
              "region": "${AWS::Region}",
              "view": "table",
              "query": "SOURCE '${LogGroup}' | filter @message like /http request status=/ | parse @message /status=(?<status>[0-9]+) method=(?<method>[A-Z]+) route=(?<route>[^ ]+) duration_ms=(?<ms>[0-9]+) code=(?<code>[^ ]+)/ | filter status >= 400 | stats count(*) as n by status, method, route, code | sort n desc | limit 30"
             }
            },
            {
             "type": "log",
             "x": 0,
             "y": 24,
             "width": 24,
             "height": 7,
             "properties": {
              "title": "1초 넘게 걸린 요청 (최근 순)",
              "region": "${AWS::Region}",
              "view": "table",
              "query": "SOURCE '${LogGroup}' | filter @message like /http request status=/ | parse @message /status=(?<status>[0-9]+) method=(?<method>[A-Z]+) route=(?<route>[^ ]+) duration_ms=(?<ms>[0-9]+) code=(?<code>[^ ]+)/ | filter ms > 1000 | sort @timestamp desc | display @timestamp, method, route, status, ms, code | limit 50"
             }
            }
           ]
          }
        - LoadBalancerFullName: !ImportValue
            'Fn::Sub': '${App}-${Env}-PublicLoadBalancerFullName'
          LogGroup: !Sub '/copilot/${App}-${Env}-${Name}'
