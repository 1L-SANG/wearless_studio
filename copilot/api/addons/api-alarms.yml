# api 전용 지표 알람. 환경 애드온(copilot/environments/addons/alarm-slack.yml)과 같은 Slack 채널로 간다.
#
# 여기 있는 이유: api 타깃그룹 차원이 필요한데, 그 타깃그룹은 이 서비스 스택이 만든다. 환경
# 애드온에서는 지목할 수 없어서 addons.parameters.yml 로 TargetGroupFullName 을 넘겨받는다.
# api 가 없는 환경이나 api 를 지운 뒤에는 이 알람도 같이 없어지므로, "지표가 없다"가 장애로
# 오해되는 일이 없다.
#
# 알림 경로(SNS, 램다, 웹훅)는 환경 애드온의 것을 그대로 쓴다. 토픽 ARN 은 환경 애드온의
# export(${App}-${Env}-AlarmTopicArn)를 가져온다.
Parameters:
  App:
    Type: String
  Env:
    Type: String
  Name:
    Type: String
  # addons.parameters.yml 이 서비스 스택의 TargetGroup 에서 넘겨준다.
  TargetGroupFullName:
    Type: String

Resources:
  # api 에 정상 서버가 없다. 1분 중 한 번이라도 0대면 운다(Minimum).
  #
  # 헬스체크가 10초 간격, 2회 실패면 비정상이라서 8/26 같은 37초 이벤트루프 동결은 20~40초
  # 비정상으로 끝난다. 2분 연속을 요구하면 이걸 놓쳐서 1분 1회로 둔다. 60일 실측에서 정상
  # 서버가 0대인 분은 한 번도 없었다(배포 중에도 새 서버가 먼저 붙는다). 오탐 비용이 없다.
  #
  # 서버가 모두 빠지면 타깃그룹이 지표를 아예 멈추므로 빈 데이터는 장애로 본다(breaching).
  # 다만 CloudWatch 는 평가 구간에 이전 값(1)이 남아 있는 동안 그것으로 판정하므로, 이 경우는
  # 몇 분 늦게 울 수 있다. 부팅 자체가 실패하면 로그 알림(Application startup failed)이 먼저 온다.
  NoHealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${App}-${Env}-${Name}-no-healthy-target'
      AlarmDescription: 'api 에 정상 서버가 0대예요. 사용자 요청이 실패하고 있을 수 있어요. ECS 서비스 이벤트와 /healthz 를 확인하세요.'
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !ImportValue
            'Fn::Sub': '${App}-${Env}-PublicLoadBalancerFullName'
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !ImportValue
          'Fn::Sub': '${App}-${Env}-AlarmTopicArn'
      OKActions:
        - !ImportValue
          'Fn::Sub': '${App}-${Env}-AlarmTopicArn'
