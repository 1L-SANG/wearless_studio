  # 학습이 끝나 ready LoRA 행이 붙는 순간 큐에 한 건 들어간다. 컷 생성(gpt-image)은 하지
  # 않는다 — 고정 기준 원본 4장에 얼굴만 세 번 다시 그린다(생성 비용 0, 얼굴 렌더 12회).
  # ★ 켜기 전에 아래 기준 원본 두 줄이 채워져 있어야 한다. 비어 있으면 런이 시작조차 안 한다.
  # 학습 큐와 같은 성격의 안전장치 — 켤 예정이니 지우지 말 것.
  FM_TEST_CUT_BUILD: "off"
  # 기준 원본 — **사람이 바뀌어도 그대로인 고정 자산**이다(얼굴 전용 비공개 R2 키, 쉼표로 2장씩).
  # 사람 간 비교가 되려면 입력이 같아야 한다. 갈아 끼우면 다음 생성부터 새 원본을 쓴다.
  FM_TEST_CUT_SOURCE_CLOSEUP: ""
  FM_TEST_CUT_SOURCE_FULLBODY: ""
  # 얼굴 렌더 파드를 기다리는 상한(초). 파드가 없는 건 실패가 아니라 대기다 — 이 런 자체가
  # 수요라 face_autoscale 이 보고 켠다. 넘으면 실패로 남기고 관리자가 본다.
  FM_TEST_CUT_POD_WAIT_SECONDS: "1200"

  # ---- 카카오 OpenID Connect 직접 로그인(app/kakao_oidc.py) ----
  # Supabase GoTrue 가 카카오 authorize 의 scope 에 account_email 을 **하드코딩**해 붙이는데
  # 우리 앱은 그 항목이 "권한 없음"이라 인가 요청이 전부 KOE205 로 거절됐다(2026-09-22,
  # 카카오 로그인 전원 실패). 그래서 카카오만 OIDC 로 직접 로그인하고 api 가 인가코드를
  # id_token 으로 교환한다. 런북: docs/runbooks/kakao-oidc-login.md
  #
  # 🔴 이 값은 **Supabase 대시보드 Kakao provider 의 client_id 와 같은 값**이다.
  #    GoTrue 가 signInWithIdToken 에서 id_token 의 aud 를 그 값과 대조한다(token_oidc.go).
  #    한쪽만 바꾸면 카카오 로그인이 전부 실패한다. 공개값(브라우저의 authorize URL 에
  #    그대로 실린다)이라 시크릿이 아니라 여기 평문으로 둔다.
  # ⚠️ 이 줄이 빠지면 라우트가 조용히 503 으로만 떨어진다 — 지금 겪은 사고와 증상이
  #    똑같아 원인 판별이 어려워진다. 미선언은 test_deploy_manifest_qc_flags.py 가 잡는다.
  KAKAO_REST_API_KEY: "7b78ab8b674afa91063744476ab946e9"
  # 짝이 되는 KAKAO_CLIENT_SECRET 은 아래 secrets 블록에 있다. 카카오 콘솔의 Client Secret
  # 이 '사용함'이라 토큰 교환에 필수다(끄면 PKCE 가 그 자리를 대신하지만, 끄는 순간
  # Supabase provider 에 저장된 값도 같이 무의미해져 롤백 경로가 흔들린다 — 켠 채로 간다).

secrets:                         # SSM Parameter Store (SecureString). copilot secret init 로 값 저장.
  # 입금 계좌번호 Fernet 암호화 키. 2026-09-11 SSM(us-east-1)에 저장함. 바꾸면 저장된 계좌를 못 읽으니 회전 금지.
  FM_PAYOUT_ACCOUNT_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_PAYOUT_ACCOUNT_KEY
  DATABASE_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DATABASE_URL
  SUPABASE_SERVICE_ROLE_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/SUPABASE_SERVICE_ROLE_KEY
  R2_ACCESS_KEY_ID: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/R2_ACCESS_KEY_ID
  R2_SECRET_ACCESS_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/R2_SECRET_ACCESS_KEY
  CLOUDFLARE_CACHE_PURGE_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/CLOUDFLARE_CACHE_PURGE_TOKEN
  GEMINI_API_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/GEMINI_API_KEY
  # 얼굴 렌더 서비스 인증 토큰과 RunPod API 키.
  # ★ SSM 값 없이 이 두 줄이 배포되면 ECS 태스크가 기동에 실패하고 롤백된다(2026-07-17 주석과 같은 함정).
  #   배포 전 반드시: copilot secret init --name FACE_IDENTITY_BACKEND_TOKEN / --name RUNPOD_API_KEY
  FACE_IDENTITY_BACKEND_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FACE_IDENTITY_BACKEND_TOKEN
  RUNPOD_API_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/RUNPOD_API_KEY
  # 첫 화면 시그니처 컷과 AG-06 상세컷 GPT 경로가 함께 사용한다.
  # 배포 전 SSM SecureString이 실제로 존재하는지 확인한다.
  OPENAI_API_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/OPENAI_API_KEY
  # CX 본인확인 HMAC pepper. 없으면 /v1/facemarket/identity/verify 가 503.
  # ⚠️ 배포 전 값 저장 필요: copilot secret init --name FM_CI_PEPPER (프로드 SSM).
  FM_CI_PEPPER: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_CI_PEPPER
  FM_LIVENESS_BROWSER_ROLE_ARN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_LIVENESS_BROWSER_ROLE_ARN
  # api 가 fm-holder 로 보내는 VC 요청 서명용 HMAC. 홀더도 같은 값을 봐야 검증된다(opendid manifest
  # 와 동일 SSM 파라미터). 미설정이면 issue_face_vc 게이트가 503(라이선스는 나오되 VC 스킵).
  # ⚠️ 배포 전 값 저장 필요: copilot-aws secret init --name OPENDID_HOLDER_HMAC_SECRET (프로드 SSM).
  OPENDID_HOLDER_HMAC_SECRET: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/OPENDID_HOLDER_HMAC_SECRET
  # 온체인 정산 시크릿. RPC URL 은 쿼리에 게이트웨이 auth 토큰이 박혀 있어 URL 전체가 시크릿.
  # ⚠️ 배포 전 값 저장 필요(없으면 ECS 태스크 기동 실패): scripts/fm-chain-secrets.sh 참고.
  FM_CHAIN_RPC_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_CHAIN_RPC_URL
  # 토스페이먼츠 결제 승인 API 시크릿(WS3). 없으면 /v1/payments/toss/checkout 이 503
  # payment_not_configured — 키 없이 '목 성공'을 주지 않는 설계라 결제만 비활성된다.
  # ⚠️ 이 줄을 배포하기 **전에** SSM 값을 먼저 만들어야 한다(없으면 ECS 기동 실패→롤백):
  #     copilot-aws secret init --name TOSS_SECRET_KEY
  #   raw `aws ssm put-parameter` 로 만들면 copilot 태그가 없어 태스크가 못 읽는다(2026-07-17 실경험).
  TOSS_SECRET_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/TOSS_SECRET_KEY
  # 정기결제(빌링) — 계획서 docs/plans/2026-09-09-toss-billing-subscription.md.
  # ⚠️ 자동결제는 별도 계약 MID 라 일반결제와 시크릿 키가 다를 수 있다. 개발자센터 API 키
  #    메뉴에서 '자동결제로 계약된 MID' 를 고른 뒤의 키를 넣는다. 비우면 TOSS_SECRET_KEY 로
  #    떨어지므로 MID 가 하나인 상점이면 등록하지 않아도 된다.
  #     copilot-aws secret init --name TOSS_BILLING_SECRET_KEY
  TOSS_BILLING_SECRET_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/TOSS_BILLING_SECRET_KEY
  # 빌링키 컬럼 암호화 키(pgcrypto pgp_sym_encrypt). ⚠️ 이 값을 잃으면 저장된 빌링키를
  #    전부 복호화할 수 없고, 빌링키는 재조회가 불가능하므로 **전 구독자가 카드를 다시
  #    등록**해야 한다. 로테이션은 반드시 재암호화 마이그레이션과 함께 한다.
  TOSS_BILLING_KEK: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/TOSS_BILLING_KEK
  # 웹훅 경로 시크릿 — 토스 일반 웹훅에는 서명 헤더가 없어 경로 지식이 인증 대용이다.
  TOSS_WEBHOOK_PATH_SECRET: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/TOSS_WEBHOOK_PATH_SECRET
  FM_CHAIN_PRIVATE_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_CHAIN_PRIVATE_KEY
  # 출처증명 C2PA 자체서명 인증서(리프 cert/key). 둘 다 있어야 서명기가 활성화된다 —
  # 하나만 있으면 c2pa_status='skipped'. 발급·업로드 절차: 런북 §1(gen_c2pa_cert.py).
  FM_C2PA_CERT_PEM: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_C2PA_CERT_PEM
  FM_C2PA_KEY_PEM: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_C2PA_KEY_PEM
  # 배포된 FaceMarketProvenance 컨트랙트 주소(0x…, 공개값이지만 재배포 시 매니페스트
  # 커밋 없이 SSM 값만 갱신할 수 있도록 secrets: 로 둔다). 런북 §3 — OmniOne 콘솔 단일
  # 파일 업로드, 배포자 = FM_CHAIN_PRIVATE_KEY 계정(onlyOwner).
  FM_PROVENANCE_ADDRESS: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_PROVENANCE_ADDRESS
  # 배포본 업로드 토큰 HMAC. FM_CI_PEPPER(생체 CI 해시 전용) 재사용 금지 — 재사용하면 그
  # 시크릿의 blast radius 가 presign/sign 이라는 더 노출된 경로로 번진다(리뷰 I1,
  # 2026-09-04). 미설정이면 presign/sign 이 즉시 503 provenance_unconfigured 로 폐쇄
  # 실패한다(fm_ci_pepper 로 조용히 대체되지 않는다). 런북 §2 — openssl rand -hex 32.
  FM_PROVENANCE_TOKEN_SECRET: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_PROVENANCE_TOKEN_SECRET
  # ---- 모델 지원서 리뉴얼 ----
  # 새 지원서 Slack 알림 — 전용 채널 #facemarket-모델인증 의 Incoming Webhook(2026-09-02).
  # 크리티컬 로그 알림(addons/log-slack-alerts.yml)의 SLACK_ALERT_WEBHOOK_URL 과 **다른 파라미터**다.
  # 운영 장애 알림과 지원서 접수 알림이 한 채널에 섞이면 둘 다 안 보게 된다.
  FM_SLACK_WEBHOOK_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_SLACK_WEBHOOK_URL
  # ⚠️ 배포 전 값 저장 필요: copilot-aws secret init --name RESEND_API_KEY (프로드 SSM). 없으면 배포가
  #   "secret not found" 로 실패한다(앱은 키가 없어도 뜨지만 — 메일은 원장에 failed 로 남고 "메일 미발송"
  #   뱃지·재발송으로 복구 — copilot 이 참조를 먼저 검사한다).
  RESEND_API_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/RESEND_API_KEY
  # 내부 SAM2 서비스 호출용 공유 시크릿. sam2 매니페스트가 **같은 파라미터**를 읽으므로
  # 양쪽이 한 값을 보고, 값은 저장소에 절대 들어오지 않는다. 이미 생성돼 있고 copilot 태그도
  # 붙어 있다(copilot-application=wearless, copilot-environment=prod).
  #     copilot-aws secret init --name SAM_INTERNAL_TOKEN
  #   raw `aws ssm put-parameter` 는 태그가 없어 태스크가 못 읽는다 — sam2 첫 배포가 그걸로 죽었다.
  SAM_INTERNAL_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/SAM_INTERNAL_TOKEN
  # 카카오 OIDC 인가코드 교환용 Client Secret(app/kakao_oidc.py). 콘솔의 'Client Secret
  # 사용함' 상태와 한 몸이다 — 콘솔에서 재발급하면 이 SSM 값도 같이 갱신해야 한다.
  # 미설정이면 교환이 401 로 죽는다(코드는 값이 없으면 안 보내고 PKCE 로만 간다).
  # ★ 값을 먼저 만들고 이 줄을 배포한다 — 순서가 바뀌면 ECS 기동 실패 후 롤백된다.
  #     copilot-aws secret init --name KAKAO_CLIENT_SECRET
  #   2026-09-23 use1 에 SecureString 생성 확인(prod 환경은 미생성 — 서울 롤백용이라 배포 시 먼저 넣을 것).
  KAKAO_CLIENT_SECRET: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/KAKAO_CLIENT_SECRET
