# The manifest for the "api" service.
# Read the full specification for the "Load Balanced Web Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: api
type: Load Balanced Web Service

# Distribute traffic to your service.
http:
  path: '/'
  # 배포 시간 단축(2026-07-20 실측): 기본값(30s×5회=150s healthy 대기 + 드레인 60s)이
  # copilot svc deploy 430s 중 ~210s 를 차지했다. /healthz 는 즉답 엔드포인트라
  # 10s×2회=20s 판정 + 10s 드레인이면 충분. timeout(5s) < interval(10s) ALB 제약 준수.
  healthcheck:                   # FastAPI 헬스체크 (app/main.py)
    path: '/healthz'
    healthy_threshold: 2
    unhealthy_threshold: 2
    interval: 10s
    timeout: 5s
  deregistration_delay: 10s      # 구 태스크 유휴 드레인 — API 응답이 초 단위라 10s 로 안전
  alias: api.wearless.kr         # ACM cert(c878a5bb) — env manifest certificates 로 ALB 리스너에 import

# Configuration for your containers and service.
image:
  build:
    dockerfile: server/Dockerfile
    context: server              # server/.dockerignore 적용
    # GitHub hosted runner는 매 배포마다 비어 있으므로 직전 성공 이미지의
    # 원격 BuildKit 레이어 캐시를 가져온다. CD가 성공 후 buildcache 태그를 갱신한다.
    cache_from:
      - 439328746001.dkr.ecr.ap-northeast-2.amazonaws.com/wearless/api:buildcache
    args:
      BUILDKIT_INLINE_CACHE: "1" # 다음 배포가 레지스트리 이미지에서 캐시 메타데이터를 복원
  port: 8080

cpu: 512        # Pillow 이미지 처리 여유
memory: 2048    # image_high job + OpenCV SFace ONNX(얼굴 QC) 상주. 1024는 부족(codex 리뷰).
platform: linux/x86_64
count: 1        # 항상 1개 상주 → in-process JobDispatcher 계속 살아있음
exec: true
network:
  connect: true

variables:                       # 평문 (민감하지 않음). 시크릿은 아래 secrets 블록.
  APP_ENV: production
  SUPABASE_URL: https://pedonlvyhoyedzdmmwco.supabase.co
  CORS_ORIGINS: https://ai.wearless.kr,http://localhost:5173
  SUPABASE_ANON_KEY: sb_publishable_iY1-8oAlYRJitM09dPGJnw_fs44eUzs
  R2_ACCOUNT_ID: 2b7c948b56f129faaa10e5076b9e9a66
  R2_BUCKET: wearless
  R2_ENDPOINT: https://2b7c948b56f129faaa10e5076b9e9a66.r2.cloudflarestorage.com
  R2_PUBLIC_BASE: https://images.wearless.kr
  MANNEQUIN_BASE_WOMEN_ASSET_ID: 486937ac-7cb3-4597-b563-d185d378a10d
  MANNEQUIN_BASE_MEN_ASSET_ID: 736ff2ab-0f15-4f9a-b2ee-c40cd0ed7ee0
  # shadow 모드(판정·metrics 로그만, 게이팅 X). 2026-07-07: 실 gemini-3-pro 출력에서 QC pass율
  # 0%(missing_lower_body 오탐 — 임계가 합성 프리셋 캘리브라 실 프레이밍/종횡비와 미스매치)라 게이팅이
  # 전 생성 차단. 워커 step emit 이 이제 metrics 도 남기니 shadow 로 실측 분포 모아 재캘리브 후 다시 true.
  MANNEQUIN_QC_ENABLED: "false"
  # P1 축 인지 QC + 편집 교정(§I): 미달 컷 출고 방지가 오발화 비용(내부 생성 1콜)보다 우선
  # (2026-07-14 사용자 결정). 판정 실패는 fail-open — 생성을 절대 막지 않음. 발화율·판정
  # 정확도는 axis_qc/axis_retry 이벤트로 관측, 골드셋 캘리브는 켠 상태로 병행.
  MANNEQUIN_AXIS_QC: enforce
  # AG-P2 의류 동일성 QC(색·패턴·로고·프린트가 원본과 같은 옷인가).
  # 2026-07-31 shadow → enforce. 위 주석이 요구하던 "실측 분포 캘리브레이션"을 마쳤다:
  # 임계를 실측으로 교정(90/75 는 통과율 0% 였다), 판정자 변별력 하니스, 거짓양성 육안 점검
  # 3건 오탐 0, 신규 표본 16건 + 층화 재측정, 계약 뮤테이션 26/26 — docs/mannequin-qc 참고.
  # 판정 실패는 fail-open 이라 판정기가 죽어도 생성은 안 막힌다. 되돌리려면 shadow 로 낮춘다
  # (판정·metrics 는 계속 남고 게이팅만 꺼진다).
  IMAGE_QC: enforce
  # enforce 는 regenerate 판정에서 재시도를 쓰므로 상한이 필요하다. 기본값 2 는 편집 패스
  # (untuck·fabric·bust)와 예산을 공유해서 재시도 전에 소진된다 — 실제로 그래서 가슴 2패스가
  # 한 번도 출고되지 않았다. 5 는 그 실측에서 나온 값이고, 상한이지 매번 쓰는 횟수가 아니다.
  MANNEQUIN_MAX_ATTEMPTS: "2"   # 일반 생성/QC 총 2회. untuck 은 예산 밖 전용 post-pass 1회(2026-08-12)
  # 단일 목적 편집 패스 3종. 전부 fail-open(편집 실패 = 편집 전 컷 그대로 출고)이고,
  # 편집이 등급을 떨어뜨리면 편집 전으로 되돌린다(qc_edit_regression_margin=10, 판정 노이즈
  # ±30 을 감안한 마진). 셋 다 여기 없으면 config 기본 off 로 떨어져 조용히 안 돈다.
  MANNEQUIN_UNTUCK_PASS: "on"   # 상의·아우터를 하의 밖으로 — QC 탐지가 불안정해 무조건 실행
  MANNEQUIN_FABRIC_PASS: "on"   # 미세 패턴 표면 재적용 — 두 색 줄이 한 색으로 뭉개지던 문제
  MANNEQUIN_BUST_PASS: "on"     # 가슴 볼륨(배수 1.3). 하의 상품엔 코드에서 미적용
  # 베이스 충실도 QC — 생성 컷이 베이스 마네킹의 연출(뷰·프레이밍·스케일)을 지켰는가.
  # AG-P2 는 상품 사진 + 생성물만 받아서 "베이스와 달라졌다"를 **구조적으로 판정할 수 없다**.
  # 실측(2026-08-12): AG-P2 가 auto_pass 를 준 베이스 이탈 6건을 이 QC 가 잡았다.
  #
  # enforce 지만 게이트하는 축은 **poseFrameMatch 하나뿐**이다
  # (mannequin_job._BASE_FIDELITY_GATED_AXES). 같이 판정하는 wearGeometry 는 기록만 하고
  # 재시도를 요구하지 않는다 — 진양성 2건을 전체프레임·크롭 컴포지트 양쪽에서 모두 pass 로
  # 판정해 보정 게이트를 통과하지 못했다. 축 추가는 그 게이트를 통과시킨 뒤의 별도 변경이다.
  #
  # 포즈 축 실측: 알려진 이탈 8/10 탐지, 오버사이즈·박시 대조군 오탐 0, provider 실패 0/28.
  # 판정 실패·베이스 없음·형식 위반은 전부 skip → 재시도를 요구하지 않는다(생성 안 막음).
  MANNEQUIN_BASE_FIDELITY_QC: enforce
  # 셀러가 컷을 거부하고 재생성할 때, **거부된 옛 컷**만 골라 비동기 관측 잡을 띄운다.
  # 재생성 응답은 이 판정을 기다리지 않는다(별도 job, 요청 경로 지연 0).
  # wearGeometry 보정에 필요한 진짜 실패 표본을 여기서 모은다 — 지금 확보된 양성은 2건뿐이다.
  MANNEQUIN_BASE_FIDELITY_OBSERVE_REGENERATIONS: "on"
  # AG-01 분석 provider 모델 — config.py 기본(gemini-2.5-pro) 오버라이드. AI Studio 유효 id 여야 함
  # (구값 'gemini-3-pro' 는 미존재 → Gemini 404 로 분석 실패했음). OpenAI 키 미설정이라 gemini 가 유일 provider.
  # 내부 SAM2 세그멘테이션 서비스(Copilot Service Connect, 같은 VPC 안에서만 접근).
  # 이름/포트는 copilot/sam2/manifest.yml 에서 확인한 값이다(name: sam2, port: 8080).
  # 미설정이면 sam_client 가 비활성 → sam_preprocess 는 skipped, 생성은 RAW 그대로 — 이 서비스가
  # 죽어도 업로드·분석·마네킹 생성은 전부 그대로 돈다.
  SAM_SERVICE_URL: http://sam2:8080
  MODEL_ROUTING_TEXT_GEMINI: gemini-3.1-pro-preview
  # '배경만' 생성예시는 빈 장소 플레이트 편집 + 장소 일치 QC/재시도 방식으로 검증했다.
  # 프론트 VITE_GENEXAMPLE_BG_ENABLED와 함께 켜야 하며, 2026-07-21부터 프로덕션 공개.
  GENEXAMPLE_BG_ENABLED: "true"
  # ---- FaceMarket(해커톤, PR #22) — 얼굴 라이선스·개인화·연령게이트. off면 라우터 자체가 미등록.
  # 이걸 안 켜면 배포는 성공해도 프로드에 FaceMarket 기능이 조용히 없다(에러도 안 남 = 설계).
  FACEMARKET_ENABLED: "true"
  PERSONALIZATION_ENABLED: "true"
  # 얼굴=생체 PII 전용 비공개 버킷(공개 도메인 미연결). 위 둘을 켜면 non-dev 에서 main.py 의
  # fail-fast 가드가 이 값을 요구한다(미설정 시 얼굴이 공개 메인버킷으로 새는 걸 기동 실패로 막음).
  R2_FACE_BUCKET: wearless-face
  # 실존 모델 얼굴 대조 QC(handoff §03 필수 게이트) — OpenCV SFace/YuNet(Dockerfile 번들).
  # 3장 pairwise 코사인 최소값 < threshold 면 자산 등록 차단. 임계는 골드셋 캘리브 후 조정.
  FM_FACE_QC_ENABLED: "true"
  FM_FACE_QC_THRESHOLD: "0.363"
  # OPENDID_HOLDER_URL: 프로드 홀더 미배포 → 미설정. VC 발급은 비치명적으로 스킵(라이선스는 정상,
  # vc_id 만 null). 데모는 로컬 터널로 진행. 홀더를 프로드에 배포하면 여기에 그 주소를 넣는다.
  # ---- FaceMarket 온체인 정산(선택과제2). 넷 다 있어야 recorder 활성(facemarket_chain.from_settings),
  # 하나라도 없으면 정산 훅 no-op(settlement_skipped_no_chain). 주소·chainId 는 공개값이라 평문.
  FM_CHAIN_ID: "201210"
  FM_SETTLEMENT_ADDRESS: "0x39445B04d8F588Ea5E447ff03D8A4b253a6d67A3"

secrets:                         # SSM Parameter Store (SecureString). copilot secret init 로 값 저장.
  DATABASE_URL: /copilot/wearless/prod/secrets/DATABASE_URL
  SUPABASE_SERVICE_ROLE_KEY: /copilot/wearless/prod/secrets/SUPABASE_SERVICE_ROLE_KEY
  R2_ACCESS_KEY_ID: /copilot/wearless/prod/secrets/R2_ACCESS_KEY_ID
  R2_SECRET_ACCESS_KEY: /copilot/wearless/prod/secrets/R2_SECRET_ACCESS_KEY
  GEMINI_API_KEY: /copilot/wearless/prod/secrets/GEMINI_API_KEY
  # CX 본인확인 HMAC pepper. 없으면 /v1/facemarket/identity/verify 가 503.
  # ⚠️ 배포 전 값 저장 필요: copilot secret init --name FM_CI_PEPPER (프로드 SSM).
  FM_CI_PEPPER: /copilot/wearless/prod/secrets/FM_CI_PEPPER
  # 온체인 정산 시크릿. RPC URL 은 쿼리에 게이트웨이 auth 토큰이 박혀 있어 URL 전체가 시크릿.
  # ⚠️ 배포 전 값 저장 필요(없으면 ECS 태스크 기동 실패): scripts/fm-chain-secrets.sh 참고.
  FM_CHAIN_RPC_URL: /copilot/wearless/prod/secrets/FM_CHAIN_RPC_URL
  # 토스페이먼츠 결제 승인 API 시크릿(WS3). 없으면 /v1/payments/toss/checkout 이 503
  # payment_not_configured — 키 없이 '목 성공'을 주지 않는 설계라 결제만 비활성된다.
  # ⚠️ 이 줄을 배포하기 **전에** SSM 값을 먼저 만들어야 한다(없으면 ECS 기동 실패→롤백):
  #     copilot-aws secret init --name TOSS_SECRET_KEY
  #   raw `aws ssm put-parameter` 로 만들면 copilot 태그가 없어 태스크가 못 읽는다(2026-07-17 실경험).
  TOSS_SECRET_KEY: /copilot/wearless/prod/secrets/TOSS_SECRET_KEY
  FM_CHAIN_PRIVATE_KEY: /copilot/wearless/prod/secrets/FM_CHAIN_PRIVATE_KEY
  # 내부 SAM2 서비스 호출용 공유 시크릿. sam2 매니페스트가 **같은 파라미터**를 읽으므로
  # 양쪽이 한 값을 보고, 값은 저장소에 절대 들어오지 않는다. 이미 생성돼 있고 copilot 태그도
  # 붙어 있다(copilot-application=wearless, copilot-environment=prod).
  #     copilot-aws secret init --name SAM_INTERNAL_TOKEN
  #   raw `aws ssm put-parameter` 는 태그가 없어 태스크가 못 읽는다 — sam2 첫 배포가 그걸로 죽었다.
  SAM_INTERNAL_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/SAM_INTERNAL_TOKEN
