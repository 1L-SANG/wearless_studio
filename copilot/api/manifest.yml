# The manifest for the "api" service.
# Read the full specification for the "Load Balanced Web Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/lb-web-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: api
type: Load Balanced Web Service

# Distribute traffic to your service.
http:
  path: '/'
  # 배포 시간 단축(2026-07-20 실측): 기본값(30s×5회=150s healthy 대기 + 드레인 60s)이
  # copilot svc deploy 430s 중 ~210s 를 차지했다. /healthz 는 즉답 엔드포인트라
  # 10s×2회=20s 판정 + 10s 드레인이면 충분. timeout(5s) < interval(10s) ALB 제약 준수.
  healthcheck:                   # FastAPI 헬스체크 (app/main.py)
    path: '/healthz'
    healthy_threshold: 2
    unhealthy_threshold: 2
    interval: 10s
    timeout: 5s
  deregistration_delay: 10s      # 구 태스크 유휴 드레인 — API 응답이 초 단위라 10s 로 안전
  alias: api.wearless.kr         # ACM cert(c878a5bb) — env manifest certificates 로 ALB 리스너에 import

# Configuration for your containers and service.
image:
  build:
    dockerfile: server/Dockerfile
    context: server              # server/.dockerignore 적용
    # GitHub hosted runner는 매 배포마다 비어 있으므로 직전 성공 이미지의
    # 원격 BuildKit 레이어 캐시를 가져온다. CD가 성공 후 buildcache 태그를 갱신한다.
    cache_from:
      - 439328746001.dkr.ecr.us-east-1.amazonaws.com/wearless/api:buildcache
    args:
      BUILDKIT_INLINE_CACHE: "1" # 다음 배포가 레지스트리 이미지에서 캐시 메타데이터를 복원
  port: 8080

cpu: 512        # Pillow 이미지 처리 여유
# image_high job + OpenCV SFace ONNX(얼굴 QC) 상주. 1024는 부족(codex 리뷰).
# 2048 은 컷 동시 생성의 상한이기도 했다: 4K 컷 하나가 응답 base64 + 디코딩본 + QC 입력을
# 동시에 잡고, repair 는 1차를 살려둔 채 2차를 만들어 컷당 4K 이미지가 두 장이다
# (detail_page_job.py 의 chosen 교체 지점). 그래서 동시 2 로 묶여 한 페이지에 ~10분이 걸렸다.
# 4096 = 0.5 vCPU 가 붙일 수 있는 최대. 동시 5 로 올려 ~4분을 목표한다(오너 승인 2026-08-19).
memory: 4096
platform: linux/x86_64
count: 1        # 항상 1개 상주 → in-process JobDispatcher 계속 살아있음
# signer-intent fence 는 이제 공유되어 구·신 task 겹침이 안전하므로 default 로 되돌린다
# (원래 주석: 안정화 후 default 안전). recreate(maxPercent=100)는 ECS Availability Zone
# Rebalancing(신규 기본기능)과 비호환 — "maximumPercent <= 100%" InvalidRequest 로 배포가
# 실패했다(2026-08-26). default 는 maxPercent=200 이라 롤링 중 새 task 를 먼저 띄운다.
deployment:
  rolling: default
exec: true
network:
  connect: true

variables:                       # 평문 (민감하지 않음). 시크릿은 아래 secrets 블록.
  APP_ENV: production
  # 상세페이지는 0대 Spot 전용 워커가 소유한다. API는 나머지 잡만 claim하고,
  # pending detail_page가 생기면 아래 autoscaler가 detail-worker를 1대로 깨운다.
  JOB_KINDS: "-detail_page"
  DETAIL_WORKER_AUTOSCALE: "on"
  # 0 이면 잡이 끝나는 즉시 0대로 내려가 **다음 잡마다 콜드스타트**(태스크 프로비저닝 +
  # 이미지 풀 + uvicorn 기동)를 다시 문다. 게다가 수요 스냅샷을 읽고 desired=0 을 쏘는
  # 사이에 새 잡이 claim 되면 그 잡이 worker_shutdown 으로 죽는다. 10분이면 연속 생성이
  # 같은 태스크를 재사용하고, 유휴 꼬리 비용은 $0.0186/h 로 무시할 수준이다.
  DETAIL_WORKER_AUTOSCALE_IDLE_MINUTES: "10"
  # Supabase session pooler 전체 한도(15)를 롤링 배포의 구·신 태스크가 함께 잠식하지 않게 한다.
  # dispatcher는 프로세스당 1개 직렬 실행이므로 3개면 충분하고, 10개 기본값을 두 태스크가
  # 동시에 잡아 PostgREST까지 PGRST002/503이 되던 2026-08-18 장애를 방지한다.
  DB_POOL_MAX_SIZE: "10"
  # 태스크당 동시 처리 잡 수. 실측(2026-08-27): 잡 1건이 CPU 2.6~9.8%, 메모리 864MB/4096MB
  # 라 3개는 150+3×714 ≈ 2.3GB(56%)로 들어온다. 4 는 73% 라 빠듯해 3 으로 둔다.
  JOB_CONCURRENCY: "3"
  SUPABASE_URL: https://ftjxwxuactfjopbokbni.supabase.co
  # facemarket.wearless.kr = 모델 등록 전용 도메인(Vercel). ai.wearless.kr = 메인 앱.
  # 등록 프론트가 facemarket 도메인서 api.wearless.kr 를 부르므로 CORS 허용 필요.
  CORS_ORIGINS: https://ai.wearless.kr,https://facemarket.wearless.kr,http://localhost:5173
  SUPABASE_ANON_KEY: sb_publishable_XRs0Dk22fSqf1UmraA70wg_RGw_3zYx
  R2_ACCOUNT_ID: 2b7c948b56f129faaa10e5076b9e9a66
  R2_BUCKET: wearless
  R2_ENDPOINT: https://2b7c948b56f129faaa10e5076b9e9a66.r2.cloudflarestorage.com
  R2_PUBLIC_BASE: https://images.wearless.kr
  CLOUDFLARE_ZONE_ID: "cc7b2bd968c6eb89fe30e45333c9ebd9"  # wearless.kr zone — images.wearless.kr CDN 캐시 파기용
  MANNEQUIN_BASE_WOMEN_ASSET_ID: 486937ac-7cb3-4597-b563-d185d378a10d
  MANNEQUIN_BASE_MEN_ASSET_ID: 736ff2ab-0f15-4f9a-b2ee-c40cd0ed7ee0
  # shadow 모드(판정·metrics 로그만, 게이팅 X). 2026-07-07: 실 gemini-3-pro 출력에서 QC pass율
  # 0%(missing_lower_body 오탐 — 임계가 합성 프리셋 캘리브라 실 프레이밍/종횡비와 미스매치)라 게이팅이
  # 전 생성 차단. 워커 step emit 이 이제 metrics 도 남기니 shadow 로 실측 분포 모아 재캘리브 후 다시 true.
  MANNEQUIN_QC_ENABLED: "false"
  # P1 축 인지 QC + 편집 교정(§I): 미달 컷 출고 방지가 오발화 비용(내부 생성 1콜)보다 우선
  # (2026-07-14 사용자 결정). 판정 실패는 fail-open — 생성을 절대 막지 않음. 발화율·판정
  # 정확도는 axis_qc/axis_retry 이벤트로 관측, 골드셋 캘리브는 켠 상태로 병행.
  MANNEQUIN_AXIS_QC: enforce
  # AG-P2 의류 동일성 QC(색·패턴·로고·프린트가 원본과 같은 옷인가).
  # 2026-07-31 shadow → enforce. 위 주석이 요구하던 "실측 분포 캘리브레이션"을 마쳤다:
  # 임계를 실측으로 교정(90/75 는 통과율 0% 였다), 판정자 변별력 하니스, 거짓양성 육안 점검
  # 3건 오탐 0, 신규 표본 16건 + 층화 재측정, 계약 뮤테이션 26/26 — docs/mannequin-qc 참고.
  # 판정 실패는 fail-open 이라 판정기가 죽어도 생성은 안 막힌다. 되돌리려면 shadow 로 낮춘다
  # (판정·metrics 는 계속 남고 게이팅만 꺼진다).
  IMAGE_QC: enforce
  # enforce 는 regenerate 판정에서 재시도를 쓰므로 상한이 필요하다. 기본값 2 는 편집 패스
  # (untuck·fabric·bust)와 예산을 공유해서 재시도 전에 소진된다 — 실제로 그래서 가슴 2패스가
  # 한 번도 출고되지 않았다. 5 는 그 실측에서 나온 값이고, 상한이지 매번 쓰는 횟수가 아니다.
  MANNEQUIN_MAX_ATTEMPTS: "2"   # 일반 생성/QC 총 2회. untuck 은 예산 밖 전용 post-pass 1회(2026-08-12)
  # 단일 목적 편집 패스 3종. 전부 fail-open(편집 실패 = 편집 전 컷 그대로 출고)이고,
  # 편집이 등급을 떨어뜨리면 편집 전으로 되돌린다(qc_edit_regression_margin=10, 판정 노이즈
  # ±30 을 감안한 마진). 셋 다 여기 없으면 config 기본 off 로 떨어져 조용히 안 돈다.
  MANNEQUIN_UNTUCK_PASS: "on"   # 상의·아우터를 하의 밖으로 — QC 탐지가 불안정해 무조건 실행
  # untuck 사전 게이트(2026-08-19 오너 승인) — 값싼 판정(~$0.01·3~5초)이 "이미 빠져 있다"고
  # **확신할 때만** 위 편집(~$0.14·40~60초)을 스킵. tucked/unclear/판정실패는 전부 기존
  # 동작(무조건 편집). 유일한 하방은 판정기가 자신 있게 틀린 스킵이며 보수 프롬프트+공유
  # 임계(edit_gate)로 관리. 스킵률·오탐은 untuck_pass.untuck_gate 필드로 관측.
  # 되돌리기: 이 줄 삭제 또는 "off".
  MANNEQUIN_UNTUCK_GATE: "on"
  MANNEQUIN_FABRIC_PASS: "on"   # 미세 패턴 표면 재적용 — 두 색 줄이 한 색으로 뭉개지던 문제
  MANNEQUIN_BUST_PASS: "on"     # 가슴 볼륨(배수 1.3). 하의 상품엔 코드에서 미적용
  # 가슴 보정 사전 게이트(2026-08-19 오너 승인) — 보정 47%가 회귀 폐기되던 실측이 근거.
  # 값싼 판정이 "이미 볼륨 충분"을 **확신할 때만** 위 보정을 스킵(예산 미소비). 나머지 전부
  # 기존 동작. 관측은 bust_pass 이벤트의 bust_gate 필드. 되돌리기: 이 줄 삭제 또는 "off".
  MANNEQUIN_BUST_GATE: "on"
  # 마네킹컷 기본 해상도 1K → 2K (2026-08-19 오너 결정). 근거 = 해상도 A/B: 1K 는 작은
  # 글자가 깨지고(실컷 0/3 통과) 2K 는 3/4 통과, pro 모델 요금은 1K 와 동일(출력 1,120tok)
  # = 추가 비용 0. 편집 패스(축·가슴·언턱·패턴)도 effective_image_size 를 따라 2K 로 돈다.
  # 미세 패턴 상품은 아래 config 기본(MANNEQUIN_PATTERN_IMAGE_SIZE=4K)이 계속 우선한다.
  # 되돌리기: 이 줄을 "1K" 로 — 재배포만으로 즉시 원복.
  MANNEQUIN_IMAGE_SIZE: "2K"
  # 로고·레터링 상품 2K 승급(해상도 A/B 근거). 기본이 2K 가 된 지금은 바닥값 역할이다 —
  # 기본을 1K 로 되돌려도 로고 상품만은 2K 를 유지한다. 끄려면 "off".
  MANNEQUIN_LOGO_IMAGE_SIZE: "2K"
  # 베이스 충실도 QC — 생성 컷이 베이스 마네킹의 연출(뷰·프레이밍·스케일)을 지켰는가.
  # AG-P2 는 상품 사진 + 생성물만 받아서 "베이스와 달라졌다"를 **구조적으로 판정할 수 없다**.
  # 실측(2026-08-12): AG-P2 가 auto_pass 를 준 베이스 이탈 6건을 이 QC 가 잡았다.
  #
  # enforce 지만 게이트하는 축은 **poseFrameMatch 하나뿐**이다
  # (mannequin_job._BASE_FIDELITY_GATED_AXES). 같이 판정하는 wearGeometry 는 기록만 하고
  # 재시도를 요구하지 않는다 — 진양성 2건을 전체프레임·크롭 컴포지트 양쪽에서 모두 pass 로
  # 판정해 보정 게이트를 통과하지 못했다. 축 추가는 그 게이트를 통과시킨 뒤의 별도 변경이다.
  #
  # 포즈 축 실측: 알려진 이탈 8/10 탐지, 오버사이즈·박시 대조군 오탐 0, provider 실패 0/28.
  # 판정 실패·베이스 없음·형식 위반은 전부 skip → 재시도를 요구하지 않는다(생성 안 막음).
  MANNEQUIN_BASE_FIDELITY_QC: enforce
  # 셀러가 컷을 거부하고 재생성할 때, **거부된 옛 컷**만 골라 비동기 관측 잡을 띄운다.
  # 재생성 응답은 이 판정을 기다리지 않는다(별도 job, 요청 경로 지연 0).
  # wearGeometry 보정에 필요한 진짜 실패 표본을 여기서 모은다 — 지금 확보된 양성은 2건뿐이다.
  MANNEQUIN_BASE_FIDELITY_OBSERVE_REGENERATIONS: "on"
  # 내부 SAM2 세그멘테이션 서비스(Copilot Service Connect, 같은 VPC 안에서만 접근).
  # 이름/포트는 copilot/sam2/manifest.yml 에서 확인한 값이다(name: sam2, port: 8080).
  # 미설정이면 sam_client 가 비활성 → sam_preprocess 는 skipped, 생성은 RAW 그대로 — 이 서비스가
  # 죽어도 업로드·분석·마네킹 생성은 전부 그대로 돈다.
  SAM_SERVICE_URL: http://sam2:8080
  # 마네킹컷 의류 영역의 색감·밝기 조정. 생성 직후 SAM 마스크를 비동기로 준비한다.
  # 미선언 시 config 기본 off 로 조용히 숨겨지므로 프로덕션 의도를 명시한다.
  MANNEQUIN_TONE_EDITOR: "on"
  # ── sam2 온디맨드 기동/종료 (2026-08-21, 오너 승인) ──
  # sam2 는 평소 0대(copilot/sam2/manifest.yml count: 0). 사진 업로드·SamUnavailable 이 켜고,
  # 30분 유휴면 api 의 reconciler 가 끈다. off 로 바꾸면 자동 기동이 멈추니 sam2 count 도 같이
  # 되돌릴 것. SAM_ALERT_TOPIC_ARN 은 여기 쓰지 않는다 — addon Output 이 자동 주입한다.
  # 정본: docs/superpowers/specs/2026-08-21-sam2-on-demand-scaling-design.md
  SAM_AUTOSCALE: "on"
  SAM_AUTOSCALE_IDLE_MINUTES: "30"
  # 콜드스타트 87초 회수(2026-08-27 실측). sam2 는 uvicorn 이 +59.6초에 이미 듣고 있는데
  # Service Connect 로 호출 가능해지는 건 +146.7초다. 전송이 끊겼을 때만 task 사설 IP
  # (DescribeTasks 가 +5초, 아직 PROVISIONING 일 때 이미 준다)로 한 번 더 간다.
  # 따뜻한 경로는 그대로 http://sam2:8080 이고, SAM_AUTOSCALE 이 off 면 효력이 없다.
  # 정본: server/app/services/sam_endpoint.py
  SAM_DIRECT_ENDPOINT: "on"
  # ── opendid(fm-holder) 온디맨드 기동/종료 ──
  # opendid 는 평소 0대(copilot/opendid/manifest.yml count {spot:0}). 등록이 holder 단계
  # (license_pending·vc_pending)에 오면 api 가 깨우고, 30분 유휴면 reconciler 가 끈다.
  # sam 과 같은 SNS 토픽(SAM_ALERT_TOPIC_ARN)을 쓴다. off 로 바꾸면 자동 기동이 멈추니
  # opendid count 도 같이 되돌릴 것. 첫 VC 발급은 콜드스타트(~2분) → vc_issue_delayed 재시도.
  OPENDID_AUTOSCALE: "on"
  OPENDID_AUTOSCALE_IDLE_MINUTES: "30"
  # ── 커스텀 매칭 의류(내 옷) 파이프라인 (2026-08-16 활성화, PR #129/#131/#143) ──
  # 셀러가 올린 매칭 의류의 배경을 SAM2 로 제거해 시드 카탈로그와 같은 회색 컷으로 만든다.
  # 무과금·이미지 생성 없음. SAM 이 죽어도 원본을 그대로 두고 등록·선택은 계속된다(fail-open).
  MATCHING_CUTOUT: "on"
  # 누끼본을 정면 flat-lay 로 재렌더한다(스파이크 전략 B — Identity Lock 프롬프트).
  #   full = 카드 썸네일 + **마네킹 생성 입력 grid 의 front 칸**까지 교체.
  # 접힌 채 찍힌 하의가 착장에서 실루엣·원단을 잃던 문제의 해법이다(2026-08-14 실측:
  # 접힌 갈색 배럴팬츠 → 갈색 청바지). 이미 만든 1장을 재사용하므로 이미지 호출은 늘지 않고,
  # 재렌더가 실패하면 누끼 썸네일(그 폴백은 셀러 원본)이 그대로 남는다.
  MATCHING_FLATLAY: full
  # flat-lay 재렌더 모델. 리포트는 정체성 동률·비용 절반·속도 2배로 flash 를 추천했으나,
  # 디테일 우선으로 pro 를 쓴다(오너 결정 2026-08-15). 비용을 줄이려면 image_light.
  MATCHING_FLATLAY_TIER: image_high
  # 매칭 하의(코디 바지) 정체성 QC. 기존 AG-P2 판정 1콜에 바지 원본 1장을 얹어 함께 본다
  # (이미지·비전 호출 증가 0). enforce = 하드 게이트 4종(색·종류·통·구조) 위반 시
  # **기존 예산 안에서** 재롤하고, 그래도 남으면 그 컷을 드롭한다(전신 재생성 슬롯 신설 없음).
  # 주름·미세광택은 점수만 남기고 막지 않는다. 편집(bust/untuck) 후 바지 영역이 회귀하면
  # 로컬 픽셀 비교(AI 콜 0)로 그 편집만 되돌린다.
  MANNEQUIN_PANTS_QC: enforce
  # 4K 생성은 응답 JSON(base64)·디코딩본·QC 입력을 동시에 메모리에 잡는다. 9컷 무제한
  # 병렬은 2GB API 태스크를 종료시켜 생성된 5장까지 저장 전에 유실됐다(2026-08-18).
  # 품질·컷 수는 그대로 두고 동시 실행만 2개로 제한한다. 블록 안에서는
  # 고정 GPT Image 2 1차 → 독립 QC → 필요 시 같은 GPT 2차 1회 → 독립 재검수 순서를 지킨다.
  # image_high는 마네킹·매칭·AG-07 공유 경로이므로 Gemini로 유지하고 AG-06만 분리한다.
  # 새 hard-gate가 garment 동일성까지 포함하므로 구 best-of 후보 생성은 중복 비용을 막기 위해 끈다.
  MODEL_ROUTING_IMAGE_HIGH: gemini-3-pro-image
  MODEL_ROUTING_DETAIL_CUT: gpt-image-2-2026-04-21
  # 상세페이지 컷 출고 해상도 4K → 2K (2026-08-26 오너 결정). GPT Image 2 에서 이 값은
  # 2:3 캔버스 2336×3504 → 1536×2304 로 바뀐다(gemini_image._OPENAI_2K_SIZE).
  # 출력 토큰이 줄어 컷당 실비도 함께 내려가고, 4K 가 원인이던 메모리 압박(아래
  # DETAIL_CUT_CONCURRENCY 주석)도 같이 완화된다. 되돌리기: 이 줄을 "4K" 로.
  DETAIL_CUT_IMAGE_SIZE: "2K"
  # 동시 컷 수 — 메모리와 **짝으로** 움직인다(아래 memory 주석 참고). 올리기 전에 반드시
  # CloudWatch MemoryUtilization 을 보고, 최악 입력(색상당 사진 6장·장당 25MB 상한)에서의
  # reference 총량까지 감안한다. 잡 단위 reference 상한이 아직 없어 최악치는 계산으로만
  # 보장되지 않는다(2026-08-19 Codex 리뷰) — 실측 전까지 5 를 상한으로 둔다.
  DETAIL_CUT_CONCURRENCY: "8"
  DETAIL_CUT_STAGGER_MS: "1000"
  # 오너가 확정한 1차 baseline은 best-of/provider 재호출이 없는 first-result 계약이다.
  DETAIL_CUT_MAX_ATTEMPTS: "1"
  GARMENT_QC_MODE: "off"
  CUT_OUTPUT_QC_MODE: repair
  # text tier 모델. AI Studio 유효 id 여야 한다 — 구값 'gemini-3-pro' 는 미존재라 Gemini 404 로
  # 분석이 통째로 죽었다(2026-07-07). OpenAI 키 미설정이라 gemini 가 유일 provider = 폴백 없음.
  #
  # 정본(model_text_gemini)은 pro 유지 — 이 값은 분석뿐 아니라 **게이팅 QC** 가 같이 쓴다
  # (IMAGE_QC·MANNEQUIN_AXIS_QC·MANNEQUIN_BASE_FIDELITY_QC = enforce, 즉 출고를 막는 판정).
  # 판정이 무뎌지면 다른 옷 컷이 그대로 상세페이지로 나간다 — 오너 결정 2026-08-14 "pro 유지".
  MODEL_ROUTING_TEXT_GEMINI: gemini-3.1-pro-preview
  # AG-01 상품 분석만 flash 로 분리 (오너 결정 2026-08-14). 실측 26벌×5조합 근거:
  # documents/research/analysis_model_ab_20260814.md — 비용 0.47배·지연 -1.3s(배포 프롬프트 기준),
  # 옷 종류 정확도 동률(73%, 오답 7벌은 5조합 전부 동일 = 프롬프트 이슈지 모델 이슈 아님),
  # 성별 18/18(pro 17/18 — 성별 라벨 표본은 26벌 중 18벌). thinking 승급은 이득 없음
  # 이라 ANALYSIS_THINKING_LEVEL 은 low 유지.
  MODEL_ROUTING_TEXT_GEMINI_ANALYSIS: gemini-3.7-flash
  # '배경만' 생성예시는 빈 장소 플레이트 편집 + 장소 일치 QC/재시도 방식으로 검증했다.
  # 프론트 VITE_GENEXAMPLE_BG_ENABLED와 함께 켜야 하며, 2026-07-21부터 프로덕션 공개.
  GENEXAMPLE_BG_ENABLED: "true"
  # ---- FaceMarket(해커톤, PR #22) — 얼굴 라이선스·개인화·연령게이트. off면 라우터 자체가 미등록.
  # 이걸 안 켜면 배포는 성공해도 프로드에 FaceMarket 기능이 조용히 없다(에러도 안 남 = 설계).
  FACEMARKET_ENABLED: "true"
  # production+FaceMarket 이면 VC 발급이 필수다(main.py _validate_facemarket_vc_settings 기동검사).
  # holder(opendid) 배포·배선을 마쳤으므로 이제 켠다 — 안 켜면 api 가 기동 실패(RuntimeError).
  # 이게 켜지면 revoke/cutover 리컨실러도 함께 활성(mandatory VC 폐기 큐).
  FACEMARKET_VC_REQUIRED: "true"
  PERSONALIZATION_ENABLED: "true"
  # 생체등록 활성화. ⚠️ 배포 순서: 이 값이 "true"인 api 를 배포하기 **전에** 반드시
  #   (1) opendid 서비스가 떠서 healthy(holder :8100 도달 가능), (2) 아래 secrets 의
  #   OPENDID_HOLDER_HMAC_SECRET·FM_CI_PEPPER·FM_LIVENESS_BROWSER_ROLE_ARN 가 SSM 에 존재해야 한다.
  #   validate_biometric_settings(facemarket_enrollment.py) 가 기동 시 이 전제를 fail-fast 로 검사하므로
  #   빠지면 api 태스크가 안 뜬다. opendid 먼저 → 그다음 이 api 재배포.
  FM_BIOMETRIC_ENROLLMENT_ENABLED: "true"
  # 실 OACX 모바일신분증 계약(D1 dlphotoimage). dev-mock 은 dev 전용이라 prod 는 이 값이어야 한다.
  FM_OACX_CONTRACT_MODE: prod-dlphoto-v1
  # CX trans 서버조회(cx.raonsecure.co.kr:18543)는 RaonSecure 방화벽이 **한국 IP만** 허용한다.
  # api 가 us-east-1(env use1)로 옮겨진 뒤 미국 egress 는 ConnectTimeout → /identity 500.
  # 해결: ap-northeast-2(서울)의 얇은 프록시(API GW→Lambda, fm-cx-proxy)로 우회해 한국 IP 로 나간다.
  # Lambda 는 /oacx/... 를 cx.raonsecure.co.kr:18543 로 그대로 forward. api 리전이 한국이면 이 값을
  # 지우고 CX 를 직접 호출해도 된다(기본값 https://cx.raonsecure.co.kr:18543).
  CX_TRANS_BASE_URL: https://93vhif0l14.execute-api.ap-northeast-2.amazonaws.com
  # AWS Face Liveness off. OACX 모바일신분증(실시간 폰 인증)이 본인확인+내재적 라이브니스를
  # 담당하고, 얼굴 스왑방지는 업로드 사진 ↔ 신분증 초상 SFace 매칭으로 한다. AWS 라이브니스는
  # 프레임 품질에 따라 매칭이 불안정(신분증 초상↔실물 0.46 vs 라이브프레임 0.25 실측)했고
  # 애드온이라 제거. 되돌리려면 "true"(브라우저 role·리전·confidence 임계 SSM/설정 필요).
  FM_LIVENESS_ENABLED: "false"
  FM_LIVENESS_REGION: us-east-1
  # 캘리브 임계 — 출발값(합리적이나 골든셋 경험 캘리브 전 잠정, 발화율·오탈락 관측 후 튜닝).
  #  · liveness confidence: AWS Face Liveness 0~100. 75 = 스푸핑 방어와 실사용자 오탈락(QA 79.8 사례)
  #    사이 밴드. 높이면 더 엄격(오탈락↑), 낮추면 느슨(스푸핑↑). QA 느슨값(1) 절대 금지.
  #  · id_live / retouched_live: SFace 코사인(0~1). 0.363 = 동일인 권장 기준선(fm_face_qc_threshold 와 동일).
  #  · id_live 0.25: 신분증 초상(옛날·인쇄)↔라이브 셀카는 도메인 갭이 커 0.363 이 오탈락한다(실측 동일인
  #    0.2816). 0.25 = 관측 통과 + 임포스터(<0.15)와 0.10 여유 + OACX 실명·라이브니스·사진매칭 다중방어.
  #  · retouched_live 0.25: 업로드 사진이 보정(뷰티/필터)되면 SFace 임베딩이 원본서 밀려 라이브
  #    매칭이 낮아진다(실측 동일인 보정사진 0.2835, 0.363 오탈락). 이름이 'retouched' 인데 값이
  #    0.363(무보정 동일)이던 것을 의도대로 완화. id_live 와 통일. 스왑방어는 id_live·라이브니스가 주.
  FM_LIVENESS_CONFIDENCE_THRESHOLD: "75"
  FM_ID_LIVE_THRESHOLD: "0.25"
  FM_RETOUCHED_LIVE_THRESHOLD: "0.25"
  FM_MATCH_POLICY_VERSION: prod-2026-08
  # OpenDID 홀더(fm-holder) — 같은 VPC service discovery. VC 발급 요청 대상. opendid 서비스 필요.
  OPENDID_HOLDER_URL: http://opendid:8100
  # 얼굴=생체 PII 전용 비공개 버킷(공개 도메인 미연결). 위 둘을 켜면 non-dev 에서 main.py 의
  # fail-fast 가드가 이 값을 요구한다(미설정 시 얼굴이 공개 메인버킷으로 새는 걸 기동 실패로 막음).
  R2_FACE_BUCKET: wearless-face
  # 실존 모델 얼굴 대조 QC(handoff §03 필수 게이트) — OpenCV SFace/YuNet(Dockerfile 번들).
  # 3장 pairwise 코사인 최소값 < threshold 면 자산 등록 차단. 임계는 골드셋 캘리브 후 조정.
  FM_FACE_QC_ENABLED: "true"
  FM_FACE_QC_THRESHOLD: "0.363"
  # ---- FaceMarket 온체인 정산(선택과제2). 넷 다 있어야 recorder 활성(facemarket_chain.from_settings),
  # 하나라도 없으면 정산 훅 no-op(settlement_skipped_no_chain). 주소·chainId 는 공개값이라 평문.
  FM_CHAIN_ID: "201210"
  FM_SETTLEMENT_ADDRESS: "0x39445B04d8F588Ea5E447ff03D8A4b253a6d67A3"

secrets:                         # SSM Parameter Store (SecureString). copilot secret init 로 값 저장.
  DATABASE_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DATABASE_URL
  SUPABASE_SERVICE_ROLE_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/SUPABASE_SERVICE_ROLE_KEY
  R2_ACCESS_KEY_ID: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/R2_ACCESS_KEY_ID
  R2_SECRET_ACCESS_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/R2_SECRET_ACCESS_KEY
  CLOUDFLARE_CACHE_PURGE_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/CLOUDFLARE_CACHE_PURGE_TOKEN
  GEMINI_API_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/GEMINI_API_KEY
  # 첫 화면 시그니처 컷과 AG-06 상세컷 GPT 경로가 함께 사용한다.
  # 배포 전 SSM SecureString이 실제로 존재하는지 확인한다.
  OPENAI_API_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/OPENAI_API_KEY
  # CX 본인확인 HMAC pepper. 없으면 /v1/facemarket/identity/verify 가 503.
  # ⚠️ 배포 전 값 저장 필요: copilot secret init --name FM_CI_PEPPER (프로드 SSM).
  FM_CI_PEPPER: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_CI_PEPPER
  FM_LIVENESS_BROWSER_ROLE_ARN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_LIVENESS_BROWSER_ROLE_ARN
  # api 가 fm-holder 로 보내는 VC 요청 서명용 HMAC. 홀더도 같은 값을 봐야 검증된다(opendid manifest
  # 와 동일 SSM 파라미터). 미설정이면 issue_face_vc 게이트가 503(라이선스는 나오되 VC 스킵).
  # ⚠️ 배포 전 값 저장 필요: copilot-aws secret init --name OPENDID_HOLDER_HMAC_SECRET (프로드 SSM).
  OPENDID_HOLDER_HMAC_SECRET: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/OPENDID_HOLDER_HMAC_SECRET
  # 온체인 정산 시크릿. RPC URL 은 쿼리에 게이트웨이 auth 토큰이 박혀 있어 URL 전체가 시크릿.
  # ⚠️ 배포 전 값 저장 필요(없으면 ECS 태스크 기동 실패): scripts/fm-chain-secrets.sh 참고.
  FM_CHAIN_RPC_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_CHAIN_RPC_URL
  # 토스페이먼츠 결제 승인 API 시크릿(WS3). 없으면 /v1/payments/toss/checkout 이 503
  # payment_not_configured — 키 없이 '목 성공'을 주지 않는 설계라 결제만 비활성된다.
  # ⚠️ 이 줄을 배포하기 **전에** SSM 값을 먼저 만들어야 한다(없으면 ECS 기동 실패→롤백):
  #     copilot-aws secret init --name TOSS_SECRET_KEY
  #   raw `aws ssm put-parameter` 로 만들면 copilot 태그가 없어 태스크가 못 읽는다(2026-07-17 실경험).
  TOSS_SECRET_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/TOSS_SECRET_KEY
  FM_CHAIN_PRIVATE_KEY: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/FM_CHAIN_PRIVATE_KEY
  # 내부 SAM2 서비스 호출용 공유 시크릿. sam2 매니페스트가 **같은 파라미터**를 읽으므로
  # 양쪽이 한 값을 보고, 값은 저장소에 절대 들어오지 않는다. 이미 생성돼 있고 copilot 태그도
  # 붙어 있다(copilot-application=wearless, copilot-environment=prod).
  #     copilot-aws secret init --name SAM_INTERNAL_TOKEN
  #   raw `aws ssm put-parameter` 는 태그가 없어 태스크가 못 읽는다 — sam2 첫 배포가 그걸로 죽었다.
  SAM_INTERNAL_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/SAM_INTERNAL_TOKEN
