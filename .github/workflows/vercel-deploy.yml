name: vercel-deploy

# Git 자동 배포가 커밋 작성자 검사로 막혔을 때만 수동 실행하는 비상 배포다.
#
# 2026-10-07: 10/02 비공개 전환 뒤 Hobby 작성자 검사를 우회하려고 push 배포를 추가했다.
# vercel pull은 Sensitive VITE_ 값을 [SENSITIVE]로 받아, CLI 빌드가 목 모드로 실행됐다.
# 이 CLI 배포가 정상 Git 배포의 운영 도메인을 덮어써 정상과 장애가 반복됐다.
# 10/05 이후 오너 커밋의 Git 자동 배포가 정상화됐으므로 운영 배포는 Git에 맡긴다.
# 수동 실행 전 Vercel의 VITE_ 변수를 Sensitive가 아닌 값으로 다시 저장해야 한다.
# 절차와 복구 방법: docs/runbooks/vercel-frontend-deploy.md
#
# 준비: Vercel Account Settings → Tokens 에서 만든 토큰을 레포 시크릿 VERCEL_TOKEN 에 넣는다.
# 조직·프로젝트 ID 는 비밀이 아니라 아래 env 에 그대로 둔다.
on:
    workflow_dispatch:

# 연달아 머지되면 마지막 것만 의미 있다.
concurrency:
    group: vercel-deploy-main
    cancel-in-progress: true

permissions:
    contents: read

env:
    VERCEL_ORG_ID: team_6tb46vcuuEIw9OBdSZJjk3Af
    VERCEL_PROJECT_ID: prj_WR3Pfd96bwLTzmSYBj5KjhJlAxCy

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: 토큰 확인
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  if [ -z "$VERCEL_TOKEN" ]; then
                    echo "::error::VERCEL_TOKEN 시크릿이 없어요 — Vercel Account Settings → Tokens 에서 만들어 넣어 주세요."
                    exit 1
                  fi
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: npm install --global vercel@62.5.0
            # 운영 환경 변수(VITE_*)와 프로젝트 설정을 Vercel 에서 받아 온다 — 저장소엔 없다.
            - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            - name: 운영 프론트 환경변수 확인
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync } from 'node:fs';
                  const lines = readFileSync('.vercel/.env.production.local', 'utf8').split(/\r?\n/);
                  const placeholders = lines.flatMap((line) => {
                    const match = line.match(/^\s*(?:export\s+)?(VITE_[A-Za-z0-9_]+)\s*=\s*(?:"\[SENSITIVE\]"|'\[SENSITIVE\]'|\[SENSITIVE\])\s*(?:#.*)?$/);
                    return match ? [match[1]] : [];
                  });
                  if (placeholders.length) {
                    console.error(`::error::${placeholders.join(', ')}: vercel pull이 Sensitive 값을 [SENSITIVE] 자리표시로 받았습니다. 이 값으로 빌드하면 운영이 목 모드 또는 잘못된 설정으로 실행됩니다. Vercel에서 해당 VITE_ 변수를 Sensitive가 아닌 값으로 다시 저장하세요.`);
                    process.exit(1);
                  }
                  NODE
            - run: vercel build --prod --token="$VERCEL_TOKEN"
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            # .git 이 있으면 CLI 가 커밋 작성자를 배포에 실어 Hobby 작성자 검사에 다시 걸릴 수 있다.
            # 빌드 산출물(.vercel/output)만 올리므로 여기서 지워도 된다.
            - run: rm -rf .git
            - name: 운영 배포
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
                  echo "배포: $url"
                  echo "### Vercel 운영 배포 완료: $url (커밋 $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
