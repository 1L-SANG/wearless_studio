name: deploy-server

# 메인 FastAPI 서비스 전용 CI/CD. SAM2 모델 서비스는 deploy-sam2.yml 이 독립 소유한다.
# 프론트는 Vercel 담당(별개).
on:
    push:
        branches: [main]
        paths:
            - "server/app/**"
            - "server/prompts/**"
            - "server/tests/**"
            - "server/scripts/**"
            - "server/pyproject.toml"
            - "server/uv.lock"
            - "server/Dockerfile"
            - "server/.dockerignore"
            - "supabase/migrations/**"
            - "copilot/api/manifest.yml"
            - "copilot/api/addons/**"
            - "copilot/detail-worker/manifest.yml"
            - ".github/workflows/deploy-server.yml"
    pull_request:
        branches: [main]
        paths:
            - "server/app/**"
            - "server/prompts/**"
            - "server/tests/**"
            - "server/scripts/**"
            - "server/pyproject.toml"
            - "server/uv.lock"
            - "server/Dockerfile"
            - "server/.dockerignore"
            - "supabase/migrations/**"
            - "copilot/api/manifest.yml"
            - "copilot/api/addons/**"
            - "copilot/detail-worker/manifest.yml"
            - ".github/workflows/deploy-server.yml"
    workflow_dispatch: {} # 수동 배포 버튼

concurrency:
    # PR 실행과 main 배포가 같은 그룹을 쓰면, **대기 중인 배포가 새 PR 푸시에 취소된다**
    # (2026-09-11 두 번 발생). PR 은 브랜치별로 묶어 최신 것만 남기고(cancel-in-progress),
    # main 배포는 단독 그룹에서 앞 배포가 끝날 때까지 기다린다.
    group: >-
        deploy-server-${{ github.event_name == 'pull_request'
        && format('pr-{0}', github.head_ref) || 'main' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    id-token: write # AWS OIDC assume-role
    contents: read

env:
    # Copilot 은 **앱 메타데이터**(/copilot/applications/wearless)를 이 리전 SSM 에서 찾는다.
    # 앱은 ap-northeast-2 에 등록돼 있고 Copilot 은 앱을 옮기는 기능이 없다. 여기를
    # us-east-1 로 바꿨더니 CI 가 통째로 죽었다(2026-08-26):
    #   ✘ get application wearless configuration: ... ssm:GetParameter on
    #     arn:aws:ssm:us-east-1:...:parameter/copilot/applications/wearless
    # 실제 배포 대상 리전은 이 값이 아니라 **환경(use1)의 정의**가 결정한다 — 여기는
    # 앱을 찾는 리전이므로 ap-northeast-2 로 둔다. (배포 역할 gha-wearless-deploy 의
    # 정책은 두 리전 ARN 을 모두 허용하도록 확장해 두었다.)
    AWS_REGION: ap-northeast-2
    COPILOT_APP: wearless
    COPILOT_ENV: use1
    COPILOT_SVC: api
    ECR_IMAGE: 439328746001.dkr.ecr.us-east-1.amazonaws.com/wearless/api

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v5
            - uses: supabase/setup-cli@v2
              with:
                  version: 2.109.1
                  github-token: ${{ github.token }}
            - name: 개인화 통합 테스트용 Supabase DB 시작
              working-directory: ${{ github.workspace }}
              run: supabase db start
            - run: uv sync --frozen
            - run: uv run pytest -q

    # 테스트·스크립트만 바뀐 push 는 CI만 돌고 ECS를 교체하지 않는다. API 이미지가 실제로
    # COPY하거나 배포 단계가 소비하는 입력만 여기서 배포 변경으로 판정한다.
    changes:
        needs: test
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        outputs:
            api: ${{ steps.filter.outputs.api }}
        steps:
            - uses: actions/checkout@v5
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      api:
                        - 'server/app/**'
                        - 'server/prompts/**'
                        - 'server/pyproject.toml'
                        - 'server/uv.lock'
                        - 'server/Dockerfile'
                        - 'server/.dockerignore'
                        - 'copilot/api/manifest.yml'
                        - 'copilot/api/addons/**'
                        - 'copilot/detail-worker/manifest.yml'
                        - 'supabase/migrations/**'
                        - '.github/workflows/deploy-server.yml'

    deploy-api:
        needs: changes
        if: |
            github.event_name != 'pull_request'
            && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: AWS 자격증명 (OIDC)
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}


            # 배포 전체가 이 한 스텝에 걸려 있다. 2026-09-07 에 여기서 두 번 죽었다.
            #
            # **진짜 버그는 `-f` 가 없던 것.** 그게 없으면 curl 은 HTTP 에러 본문을 그대로
            # 파일에 쓰고 exit 0 을 낸다. chmod +x 도 통과하니 설치 단계는 초록불이고,
            # 실패는 한참 뒤 배포 단계에서
            #     /usr/local/bin/copilot: line 1: syntax error near unexpected token `<'
            # 로 나타난다 — 원인과 아무 상관 없어 보이는 메시지라, 그동안 앱 코드를
            # 의심하게 된다(실제로 그랬다).
            #
            # 그날 다운로드가 실패한 이유 자체는 **GitHub 릴리스 에셋 CDN 의 일시 장애**다.
            # 약 10분간 92바이트짜리 504 가 왔고, 두 번째 요청부터는 0.05초 만에 돌아왔다 —
            # varnish 가 그 에러를 캐시했다는 뜻이다. GitHub 상태 페이지에는 아무 공지도
            # 없었다. 같은 URL 을 나중에 10회 재시도하니 10/10 이 200 이었다. 저장소가
            # 아카이브(2026-05)돼서 영구히 깨진 게 **아니다** — 그 둘은 무관하다.
            #
            # 그래서 셋을 둔다.
            #   -f            HTTP 에러가 파일이 아니라 종료코드가 된다.
            #   재시도         짧은 blip 은 여기서 흡수한다(10분짜리는 못 넘긴다).
            #   예비 경로       그 10분 동안 API asset 엔드포인트는 같은 파일을 200 으로 줬다.
            #                 관측 1회라 확증은 아니지만, 배포 전체를 막는 단계에
            #                 독립 경로 하나는 싸다.
            # 마지막 `copilot --version` 이 "받은 게 진짜 실행 파일인가" 를 **설치 단계에서**
            # 확인한다. 다음에 또 나면 실패 지점이 원인을 가리킨다.
            - name: Copilot CLI 설치
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  fetch() {
                    curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
                      -o /usr/local/bin/copilot "$@"
                  }
                  if ! fetch https://github.com/aws/copilot-cli/releases/download/v1.34.1/copilot-linux; then
                    echo "::warning::릴리스 다운로드 실패 — API asset 경로로 재시도"
                    asset_id=$(gh api repos/aws/copilot-cli/releases/tags/v1.34.1 \
                      --jq '.assets[] | select(.name == "copilot-linux") | .id')
                    fetch -H "Accept: application/octet-stream" \
                          -H "Authorization: Bearer $GH_TOKEN" \
                          "https://api.github.com/repos/aws/copilot-cli/releases/assets/$asset_id"
                  fi
                  chmod +x /usr/local/bin/copilot
                  copilot --version

            # DB 마이그레이션이 **가장 먼저**다. 새 job kind 는 코드(워커·라우트)와 DB
            # 제약(jobs_kind_check) 양쪽에 있어야 동작한다. 코드가 먼저 뜨면 잡 INSERT 가
            # CheckViolation 으로 죽는데, 그 실패는 삼켜지도록 짜여 있어서 **에러 없이
            # 기능만 조용히 사라진다** — sam_preprocess·base_fidelity_observe 둘 다 그렇다.
            # 순서를 코드로 못박는 이유가 그거다.

            - uses: supabase/setup-cli@v2
              with:
                  version: 2.109.1
                  github-token: ${{ github.token }}


            - name: DB 마이그레이션 적용 (prod)
              env:
                  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
              run: |
                  if [ -z "$SUPABASE_DB_URL" ]; then
                    echo "::error::SUPABASE_DB_URL 시크릿이 없습니다. 마이그레이션 없이 배포하면"
                    echo "::error::새 job kind 가 DB 제약에 없어 해당 기능이 조용히 죽습니다."
                    exit 1
                  fi
                  supabase db push --db-url "$SUPABASE_DB_URL"

            # 얼굴 렌더 파드용 코드 묶음을 R2 에 올린다(키 = face_render/<git sha>.tgz).
            #
            # 자동 생성되는 파드에는 아무 코드도 없다 — 컨테이너 디스크가 매번 초기화되고, 맥에서
            # 밀어 넣는 건 사람 손이다. 어댑터가 파드를 켜거나 만들 때 이 키의 presigned GET 을
            # env 로 넣어 주므로(파드에 R2 자격증명 없음), 서버와 파드 코드가 항상 같은 sha 가 된다.
            #
            # R2 자격증명은 **SSM 에서 읽는다**(이 워크플로에 R2 GitHub 시크릿이 없다).
            # 읽지 못하면 배포를 막지 않고 경고만 남긴다 — 그 경우 자동 생성된 파드는 코드를 받지
            # 못하고, 어댑터가 그 사실을 CRITICAL 로 알린다.
            - name: 얼굴 렌더 코드 묶음 업로드 (R2)
              continue-on-error: true      # R2 문제로 API 배포를 막지는 않는다(단계는 빨갛게 보인다)
              env:
                  # R2_ENDPOINT·R2_FACE_BUCKET 은 **SSM 이 아니라 매니페스트 평문**이다
                  # (copilot/api/manifest.yml). 이전 판은 이 둘까지 SSM 에서 읽어 항상 빈 값이
                  # 나왔고, 빈 값이면 exit 0 이라 초록불인데 업로드는 0건이었다.
                  R2_ENDPOINT: https://2b7c948b56f129faaa10e5076b9e9a66.r2.cloudflarestorage.com
                  R2_FACE_BUCKET: wearless-face
                  # 시크릿은 env 계정의 us-east-1 에 있다. 워크플로 기본 리전(ap-northeast-2)으로
                  # 읽으면 파라미터를 못 찾는다.
                  SSM_REGION: us-east-1
                  SSM_PREFIX: /copilot/${{ env.COPILOT_APP }}/${{ env.COPILOT_ENV }}/secrets
              run: |
                  set -euo pipefail
                  SHA="$(server/scripts/face_render_bundle.sh dist)"
                  echo "bundle sha256=$SHA"
                  for key in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
                    value="$(aws ssm get-parameter --with-decryption --region "$SSM_REGION" \
                      --name "$SSM_PREFIX/$key" --query Parameter.Value --output text 2>/dev/null || true)"
                    if [ -z "$value" ]; then
                      echo "::error::$SSM_PREFIX/$key 를 $SSM_REGION 에서 읽지 못했습니다."
                      echo "::error::코드 묶음을 올리지 못해 자동 생성된 얼굴 렌더 파드는 코드를 받지 못합니다."
                      exit 1
                    fi
                    export "$key=$value"
                  done
                  KEY="face_render/$GITHUB_SHA.tgz"
                  export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
                  export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
                  export AWS_DEFAULT_REGION=auto
                  # ★ OIDC 로 받은 AWS_SESSION_TOKEN 이 env 에 남아 있으면 R2 가 거부한다
                  #   (PutObject … InvalidArgument: X-Amz-Security-Token). R2 호출에서만 지운다 —
                  #   SSM 읽기는 그 토큰이 있어야 한다.
                  r2() { env -u AWS_SESSION_TOKEN aws "$@" --endpoint-url "$R2_ENDPOINT"; }
                  if ! r2 s3 cp dist/face_render.tgz "s3://$R2_FACE_BUCKET/$KEY" \
                       --metadata "sha256=$SHA" --only-show-errors; then
                    echo "::error::R2 업로드 실패: $KEY"
                    exit 1
                  fi
                  # 올렸다는 응답만 믿지 않는다 — 키가 실제로 있고 **내용 해시 메타**까지 맞는지 본다.
                  # 서버는 키를 커밋 sha 로 찾고, 파드에 넘길 CODE_SHA256 은 이 메타에서 읽는다.
                  GOT="$(r2 s3api head-object --bucket "$R2_FACE_BUCKET" --key "$KEY" \
                         --query 'Metadata.sha256' --output text 2>/dev/null || true)"
                  if [ "$GOT" != "$SHA" ]; then
                    echo "::error::업로드 후 확인 실패: $KEY (metadata sha256=$GOT)"
                    exit 1
                  fi
                  echo "uploaded and verified $KEY"

            # API가 detail_page claim을 끊기 전에 desiredCount=0 서비스를 먼저 만든다.
            # 역순이면 첫 detail 잡이 아무도 claim하지 않는 배포 공백이 생긴다.
            # 서버가 "지금 도는 코드가 어느 커밋인가"를 알아야 파드에 같은 sha 의 묶음을 준다.
            # copilot 의 ${VAR} 보간에 기대지 않고 빌드 컨텍스트에 파일로 굽는다 — api·detail-worker
            # 가 같은 컨텍스트(server/)를 쓰므로 한 번만 쓰면 둘 다 같은 값을 갖는다.
            - name: 빌드 sha 굽기 (server/BUILD_SHA)
              run: |
                  printf '%s\n' "$GITHUB_SHA" > server/BUILD_SHA
                  echo "BUILD_SHA=$GITHUB_SHA"

            - name: 상세 워커 배포 (Spot 0대)
              run: |
                  copilot svc deploy \
                    --app "$COPILOT_APP" \
                    --name detail-worker \
                    --env "$COPILOT_ENV" \
                    --tag "$GITHUB_SHA"

            - name: 배포 (이미지 빌드→ECR→ECS 롤링)
              run: |
                  copilot svc deploy \
                    --app "$COPILOT_APP" \
                    --name "$COPILOT_SVC" \
                    --env "$COPILOT_ENV" \
                    --tag "$GITHUB_SHA"


            # ALB 헬스체크(/healthz)는 프로세스가 살아 있는지만 본다 — 의존성은 안 본다.
            # 그래서 2026-09-08 에 커넥션 풀이 완전히 죽어 모든 요청이 PoolTimeout 으로
            # 실패하는 동안에도 롤링이 정상 완료되고 이 워크플로가 success 로 끝났다.
            # 장애를 알려준 건 Slack 알림뿐이었다. 여기서 /readyz 로 DB 까지 짚는다 —
            # 같은 일이 또 나면 배포가 **빨간불로** 끝난다.
            #
            # ALB 를 /readyz 로 옮기지는 않는다: DB 가 잠깐 흔들리면 모든 태스크가 동시에
            # unhealthy 가 되어 ALB 에 정상 타깃이 0개가 되고, 일시 장애가 전면 장애로
            # 커진다. 판정은 여기(배포 시점) 한 번이면 된다.
            - name: 배포 후 준비 상태 게이트 (/readyz — DB 포함)
              shell: bash
              run: |
                  set -euo pipefail
                  # 롤링 직후 구 태스크가 드레인되는 창이 있어 몇 초는 흔들릴 수 있다.
                  for attempt in 1 2 3 4 5; do
                    body=$(curl -sS --max-time 15 -o /tmp/readyz.json -w '%{http_code}' \
                      https://api.wearless.kr/readyz) || body="000"
                    if [ "$body" = "200" ]; then
                      echo "readyz OK: $(cat /tmp/readyz.json)"
                      exit 0
                    fi
                    echo "attempt $attempt: http=$body $(cat /tmp/readyz.json 2>/dev/null || true)"
                    sleep 10
                  done
                  echo "::error::/readyz 가 200 을 주지 않는다 — 배포된 서버가 DB 를 못 쓴다."
                  exit 1

            - name: 브라우저 API·R2 CORS 회귀 게이트
              shell: bash
              run: |
                  set -euo pipefail
                  check_origin() {
                    local origin="$1"
                    local api_headers
                    local r2_headers
                    local allowed_origin
                    local allowed_methods
                    local allowed_headers

                    header_value() {
                      local name="$1"
                      awk -v wanted="$name" '
                        BEGIN { IGNORECASE = 1 }
                        {
                          sub(/\r$/, "")
                          separator = index($0, ":")
                          if (separator == 0) next
                          key = substr($0, 1, separator - 1)
                          if (tolower(key) != tolower(wanted)) next
                          value = substr($0, separator + 1)
                          sub(/^[[:space:]]+/, "", value)
                          print value
                          exit
                        }
                      '
                    }

                    has_token() {
                      local values="$1"
                      local wanted="$2"
                      tr ',' '\n' <<<"$values" \
                        | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
                        | grep -Fxi -- "$wanted" >/dev/null
                    }

                    api_headers="$(curl --fail-with-body --silent --show-error \
                      -X OPTIONS 'https://api.wearless.kr/v1/projects' \
                      -H "Origin: $origin" \
                      -H 'Access-Control-Request-Method: POST' \
                      -H 'Access-Control-Request-Headers: authorization,content-type' \
                      -D - -o /dev/null)"
                    allowed_origin="$(header_value 'access-control-allow-origin' <<<"$api_headers")"
                    allowed_methods="$(header_value 'access-control-allow-methods' <<<"$api_headers")"
                    allowed_headers="$(header_value 'access-control-allow-headers' <<<"$api_headers")"
                    [[ "$allowed_origin" == "$origin" ]]
                    has_token "$allowed_methods" 'POST'
                    has_token "$allowed_headers" 'authorization'
                    has_token "$allowed_headers" 'content-type'

                    r2_headers="$(curl --fail-with-body --silent --show-error \
                      -X OPTIONS 'https://2b7c948b56f129faaa10e5076b9e9a66.r2.cloudflarestorage.com/wearless/diagnostics/cors-readonly.jpg' \
                      -H "Origin: $origin" \
                      -H 'Access-Control-Request-Method: PUT' \
                      -H 'Access-Control-Request-Headers: content-type' \
                      -D - -o /dev/null)"
                    allowed_origin="$(header_value 'access-control-allow-origin' <<<"$r2_headers")"
                    allowed_methods="$(header_value 'access-control-allow-methods' <<<"$r2_headers")"
                    allowed_headers="$(header_value 'access-control-allow-headers' <<<"$r2_headers")"
                    [[ "$allowed_origin" == "$origin" ]]
                    has_token "$allowed_methods" 'PUT'
                    has_token "$allowed_headers" 'content-type'
                  }

                  check_origin 'https://ai.wearless.kr'
                  check_origin 'http://localhost:5173'


            - name: 다음 배포용 Docker 레이어 캐시 갱신
              shell: bash
              run: |
                  set -euo pipefail
                  source_image="$ECR_IMAGE:$GITHUB_SHA"
                  cache_image="$ECR_IMAGE:buildcache"
                  docker image inspect "$source_image" >/dev/null 2>&1 \
                    || docker pull "$source_image"
                  docker tag "$source_image" "$cache_image"
                  docker push "$cache_image"
