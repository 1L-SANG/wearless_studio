name: deploy-server

# server/ 변경 시에만 배포. 프론트는 Vercel 담당(별개).
on:
    push:
        branches: [main]
        paths:
            - "server/**"
            - "copilot/**"
            - ".github/workflows/deploy-server.yml"
    pull_request:
        branches: [main]
        paths:
            - "server/**"
            - "copilot/**"
            - ".github/workflows/deploy-server.yml"
    workflow_dispatch: {} # 수동 배포 버튼

concurrency:
    group: deploy-server
    cancel-in-progress: false # 배포 중첩 방지 (롤링 중 새 배포 대기)

permissions:
    id-token: write # AWS OIDC assume-role
    contents: read

env:
    AWS_REGION: ap-northeast-2
    COPILOT_APP: wearless
    COPILOT_ENV: prod
    COPILOT_SVC: api
    ECR_IMAGE: 439328746001.dkr.ecr.ap-northeast-2.amazonaws.com/wearless/api

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v5
            - uses: supabase/setup-cli@v2
              with:
                  version: 2.109.1
                  github-token: ${{ github.token }}
            - name: 개인화 통합 테스트용 Supabase DB 시작
              working-directory: ${{ github.workspace }}
              run: supabase db start
            - run: uv sync --frozen
            - run: uv run pytest -q

    # 어떤 서비스의 **배포 입력**이 실제로 바뀌었는가. 디렉터리 이름이 아니라 각 이미지가
    # 실제로 COPY 하는 것에서 나온 목록이다(둘 다 context 는 server/ 지만 .dockerignore 가
    # 정반대로 걸려 있다):
    #
    #   API 이미지  = server/ 전체 − {sam_service, tests, scripts, .venv, app/data/face_models}
    #   SAM 이미지  = server/sam_service/ + 그 requirements.txt  (app/·prompts/·uv.lock 미포함)
    #
    # sam_service 는 app/ 을 한 줄도 임포트하지 않고 자체 requirements.txt 만 쓴다 — 확인함.
    # 그래서 공유 의존이 없고, 두 집합이 겹치지 않는다.
    changes:
        needs: test
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        outputs:
            api: ${{ steps.filter.outputs.api }}
            sam2: ${{ steps.filter.outputs.sam2 }}
        steps:
            - uses: actions/checkout@v5
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      api:
                        - 'server/app/**'
                        - 'server/prompts/**'
                        - 'server/pyproject.toml'
                        - 'server/uv.lock'
                        - 'server/Dockerfile'
                        - 'server/.dockerignore'
                        - 'copilot/api/manifest.yml'
                        - 'supabase/migrations/**'
                        - '.github/workflows/deploy-server.yml'
                      sam2:
                        - 'server/sam_service/**'
                        - 'copilot/sam2/manifest.yml'
                        - '.github/workflows/deploy-server.yml'

    # SAM 배포 입력이 바뀌었을 때만. API 만 고친 커밋은 여기를 건너뛰므로 도커 빌드·ECR
    # 푸시·ECS 태스크 교체가 아예 일어나지 않는다.
    deploy-sam2:
        needs: changes
        if: needs.changes.outputs.sam2 == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: AWS 자격증명 (OIDC)
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}


            - name: Copilot CLI 설치
              run: |
                  curl -Lo /usr/local/bin/copilot \
                    https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
                  chmod +x /usr/local/bin/copilot

            # DB 마이그레이션이 **가장 먼저**다. 새 job kind 는 코드(워커·라우트)와 DB
            # 제약(jobs_kind_check) 양쪽에 있어야 동작한다. 코드가 먼저 뜨면 잡 INSERT 가
            # CheckViolation 으로 죽는데, 그 실패는 삼켜지도록 짜여 있어서 **에러 없이
            # 기능만 조용히 사라진다** — sam_preprocess·base_fidelity_observe 둘 다 그렇다.
            # 순서를 코드로 못박는 이유가 그거다.

            - name: SAM2 서비스 배포
              run: |
                  copilot svc deploy \
                    --app "$COPILOT_APP" \
                    --name sam2 \
                    --env "$COPILOT_ENV" \
                    --tag "$GITHUB_SHA"


    # api 는 sam2 **뒤에** 온다. api 매니페스트가 SAM_SERVICE_URL 로 sam2 를 가리키므로,
    # 둘 다 바뀐 커밋에서 순서가 뒤집히면 api 가 아직 없는 sam2 를 호출한다.
    # `copilot svc deploy` 는 ECS 가 안정화될 때까지 블록하므로 job 의존만으로 "sam2 healthy
    # 대기"가 성립한다. sam2 가 스킵된 경우(API 단독 변경)에도 진행해야 하므로 always() 로
    # 받고 결과를 명시적으로 본다 — 스킵은 통과, 실패는 중단.
    deploy-api:
        needs: [changes, deploy-sam2]
        if: |
            always() && needs.changes.outputs.api == 'true'
            && (needs.deploy-sam2.result == 'success' || needs.deploy-sam2.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: AWS 자격증명 (OIDC)
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}


            - name: Copilot CLI 설치
              run: |
                  curl -Lo /usr/local/bin/copilot \
                    https://github.com/aws/copilot-cli/releases/latest/download/copilot-linux
                  chmod +x /usr/local/bin/copilot

            # DB 마이그레이션이 **가장 먼저**다. 새 job kind 는 코드(워커·라우트)와 DB
            # 제약(jobs_kind_check) 양쪽에 있어야 동작한다. 코드가 먼저 뜨면 잡 INSERT 가
            # CheckViolation 으로 죽는데, 그 실패는 삼켜지도록 짜여 있어서 **에러 없이
            # 기능만 조용히 사라진다** — sam_preprocess·base_fidelity_observe 둘 다 그렇다.
            # 순서를 코드로 못박는 이유가 그거다.

            - uses: supabase/setup-cli@v2
              with:
                  version: 2.109.1
                  github-token: ${{ github.token }}


            - name: DB 마이그레이션 적용 (prod)
              env:
                  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
              run: |
                  if [ -z "$SUPABASE_DB_URL" ]; then
                    echo "::error::SUPABASE_DB_URL 시크릿이 없습니다. 마이그레이션 없이 배포하면"
                    echo "::error::새 job kind 가 DB 제약에 없어 해당 기능이 조용히 죽습니다."
                    exit 1
                  fi
                  supabase db push --db-url "$SUPABASE_DB_URL"

            # api 보다 **먼저** 배포한다. api 매니페스트가 SAM_SERVICE_URL 로 이 서비스를
            # 가리키므로, 순서가 뒤집히면 api 는 뜨자마자 존재하지 않는 sam2 를 호출하고
            # sam_preprocess 잡이 전부 unavailable 로 떨어진다(생성·분석은 무사하지만
            # 실패 잡이 쌓인다). `copilot svc deploy` 는 ECS 서비스가 안정화될 때까지
            # 블록하므로, 단계를 순서대로 두는 것만으로 "sam2 healthy 대기"가 성립한다.

            - name: 배포 (이미지 빌드→ECR→ECS 롤링)
              run: |
                  copilot svc deploy \
                    --app "$COPILOT_APP" \
                    --name "$COPILOT_SVC" \
                    --env "$COPILOT_ENV" \
                    --tag "$GITHUB_SHA"


            - name: 브라우저 API·R2 CORS 회귀 게이트
              shell: bash
              run: |
                  set -euo pipefail
                  check_origin() {
                    local origin="$1"
                    local api_headers
                    local r2_headers
                    local allowed_origin
                    local allowed_methods
                    local allowed_headers

                    header_value() {
                      local name="$1"
                      awk -v wanted="$name" '
                        BEGIN { IGNORECASE = 1 }
                        {
                          sub(/\r$/, "")
                          separator = index($0, ":")
                          if (separator == 0) next
                          key = substr($0, 1, separator - 1)
                          if (tolower(key) != tolower(wanted)) next
                          value = substr($0, separator + 1)
                          sub(/^[[:space:]]+/, "", value)
                          print value
                          exit
                        }
                      '
                    }

                    has_token() {
                      local values="$1"
                      local wanted="$2"
                      tr ',' '\n' <<<"$values" \
                        | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
                        | grep -Fxi -- "$wanted" >/dev/null
                    }

                    api_headers="$(curl --fail-with-body --silent --show-error \
                      -X OPTIONS 'https://api.wearless.kr/v1/projects' \
                      -H "Origin: $origin" \
                      -H 'Access-Control-Request-Method: POST' \
                      -H 'Access-Control-Request-Headers: authorization,content-type' \
                      -D - -o /dev/null)"
                    allowed_origin="$(header_value 'access-control-allow-origin' <<<"$api_headers")"
                    allowed_methods="$(header_value 'access-control-allow-methods' <<<"$api_headers")"
                    allowed_headers="$(header_value 'access-control-allow-headers' <<<"$api_headers")"
                    [[ "$allowed_origin" == "$origin" ]]
                    has_token "$allowed_methods" 'POST'
                    has_token "$allowed_headers" 'authorization'
                    has_token "$allowed_headers" 'content-type'

                    r2_headers="$(curl --fail-with-body --silent --show-error \
                      -X OPTIONS 'https://2b7c948b56f129faaa10e5076b9e9a66.r2.cloudflarestorage.com/wearless/diagnostics/cors-readonly.jpg' \
                      -H "Origin: $origin" \
                      -H 'Access-Control-Request-Method: PUT' \
                      -H 'Access-Control-Request-Headers: content-type' \
                      -D - -o /dev/null)"
                    allowed_origin="$(header_value 'access-control-allow-origin' <<<"$r2_headers")"
                    allowed_methods="$(header_value 'access-control-allow-methods' <<<"$r2_headers")"
                    allowed_headers="$(header_value 'access-control-allow-headers' <<<"$r2_headers")"
                    [[ "$allowed_origin" == "$origin" ]]
                    has_token "$allowed_methods" 'PUT'
                    has_token "$allowed_headers" 'content-type'
                  }

                  check_origin 'https://ai.wearless.kr'
                  check_origin 'http://localhost:5173'


            - name: 다음 배포용 Docker 레이어 캐시 갱신
              shell: bash
              run: |
                  set -euo pipefail
                  source_image="$ECR_IMAGE:$GITHUB_SHA"
                  cache_image="$ECR_IMAGE:buildcache"
                  docker image inspect "$source_image" >/dev/null 2>&1 \
                    || docker pull "$source_image"
                  docker tag "$source_image" "$cache_image"
                  docker push "$cache_image"
