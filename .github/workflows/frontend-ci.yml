name: frontend-ci

# 프론트 배포는 Vercel 담당(별개). 이 워크플로는 머지 전에 테스트·빌드만 검증한다.
# paths 목록이 push/pull_request 에 중복인 것은 의도적 — GitHub Actions 는 YAML 앵커를 지원하지 않는다.
on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - "tests/frontend/**"
            - "seller.html"
            # facemarket.wearless.kr 이 받는 문서. 이게 빠져 있으면 그 파일만 고친 PR 에서
            # CI 가 통째로 건너뛰고, 문서↔진입점 짝을 지키는 테스트도 안 돈다.
            - "facemarket.html"
            # 호스트별 배급 규칙. facemarket.html 과 한 쌍이라 같이 검사해야 한다.
            - "vercel.json"
            - "package.json"
            - "pnpm-lock.yaml"
            - "vite.config.js"
            # 조립 정본 대조 테스트가 서버 page_assembler 를 직접 실행한다.
            - "server/app/agents/**"
            - "server/pyproject.toml"
            - "server/uv.lock"
            - ".github/workflows/frontend-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "src/**"
            - "tests/frontend/**"
            - "seller.html"
            # facemarket.wearless.kr 이 받는 문서. 이게 빠져 있으면 그 파일만 고친 PR 에서
            # CI 가 통째로 건너뛰고, 문서↔진입점 짝을 지키는 테스트도 안 돈다.
            - "facemarket.html"
            # 호스트별 배급 규칙. facemarket.html 과 한 쌍이라 같이 검사해야 한다.
            - "vercel.json"
            - "package.json"
            - "pnpm-lock.yaml"
            - "vite.config.js"
            - "server/app/agents/**"
            - "server/pyproject.toml"
            - "server/uv.lock"
            - ".github/workflows/frontend-ci.yml"
    workflow_dispatch: {} # 수동 실행 버튼

concurrency:
    group: frontend-ci-${{ github.ref }}
    cancel-in-progress: true # 배포가 아니므로 오래된 실행은 취소해도 안전

permissions:
    contents: read

jobs:
    # 168 파일을 3샤드로 나눠 병렬로 돈다(2026-09-22). 벽시계를 정하는 건 테스트 안 시간이 아니라
    # vite SSR 서버를 띄우는 파일 20여 개의 시작 비용(모듈 그래프 변환)인데, 4 vCPU 러너에선
    # 파일 3개씩만 돌아 4분 40초가 걸렸다. 샤드는 파일 순서 기준 round-robin — 파일이 늘어도 자동.
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            # tests/frontend/storyboard-opening-row.test.mjs 는 목 조립기와 서버
            # page_assembler 의 결과를 대조하므로 server/.venv 가 필요하다.
            # setup-uv 는 v9 이동 태그를 아직 안 내서 정확한 버전으로 고정한다.
            - uses: astral-sh/setup-uv@v9.0.0
            - name: 조립 정본 대조용 서버 파이썬 환경
              working-directory: server
              run: uv sync --frozen

            - name: 테스트 (샤드 ${{ matrix.shard }}/3)
              run: |
                  files=$(ls tests/frontend/*.test.mjs | awk -v s=${{ matrix.shard }} 'NR % 3 == s - 1')
                  echo "$files" | wc -l | xargs echo "files in shard:"
                  MOCK_API_LATENCY_SCALE=0 node --test $files
            # 빌드는 한 샤드만 — 세 번 할 이유가 없다.
            - run: pnpm build
              if: matrix.shard == 1
