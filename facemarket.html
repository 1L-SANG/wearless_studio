<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 탭 아이콘은 FaceMarket 심볼만 쓴다(정사각 크롭). 로고 원본은 279x58 워드마크라
       16px 정사각 칸에 넣으면 글자 높이가 3px 로 눌려 회색 얼룩이 된다. -->
  <link rel="icon" type="image/svg+xml" href="/assets/brand/facemarket-mark.svg" />
  <meta name="theme-color" content="#f8fbfd" />
  <title>FaceMarket — 내 얼굴을 라이선스로</title>

  <!-- ============================================================
       facemarket.wearless.kr 전용 문서.

       왜 파일이 따로 있나 — 공유 미리보기(og:*)와 <title> 은 **정적 head 가 전부**다.
       카카오톡·슬랙·트위터·디스코드 크롤러는 JS 를 실행하지 않으므로 LandingShell 의
       런타임 head 교체(applyHead)는 크롤러에 안 보인다. host.js 의 도메인 분기도
       브라우저에서 hostname 을 읽는 런타임 분기라 정적 head 에 닿지 않는다.
       그래서 문서를 두 벌 내고 **Vercel 이 호스트로 갈라 준다**:

         vite.config.js  rollupOptions.input = { index, facemarket }   ← 산출물 두 벌
         vercel.json     rewrites 의 has: [{ type: 'host', … }]        ← 호스트별 배급

       둘은 한 쌍이다. input 없이 rewrite 만 걸면 facemarket 루트가 404 가 되고,
       rewrite 없이 input 만 두면 이 파일이 아무에게도 안 간다.
       **배포는 여전히 한 벌이다** — 프로젝트도 번들도 하나고, 갈라지는 건 이 문서뿐이다.

       ▶ 본문(<body>)은 index.html 과 같아야 한다. 같은 /src/main.jsx 를 물고, 같은 앱이
         뜬다. 여기서 갈라지는 건 head 뿐이다. main.jsx 를 바꾸면 두 파일 다 봐라.

       ▶ og:url 은 일부러 뺐다(index.html 과 같은 이유). 카카오톡은 og:url 을 카드의
         이동 대상으로 쓰는데, 없으면 실제 요청 URL 로 폴백한다. 이 문서는 facemarket
         호스트에서만 나가므로 박아도 되지만, 프리뷰 배포(*.vercel.app)에서 공유하면
         카드가 프로덕션으로 튀어 무엇을 보고 있는지 헷갈린다.

       ▶ og:image 는 index.html 과 같은 파일을 쓴다(temp-nav-logo.png, 256×260).
         이 얼굴들(가상 모델)을 미리보기 썸네일로 쓰지 마라 — 공유 카드는 캐시되고
         재배포·이미지 교체 뒤에도 남는다. 정식 1200×630 OG 이미지가 생기면 두 파일을
         같이 바꾼다.
       ============================================================ -->
  <meta name="description" content="얼굴을 등록하고, 어떤 품목에 건당 얼마로 얼마 동안 쓸 수 있는지 직접 정합니다. 정한 조건은 누구나 확인할 수 있는 라이선스로 남습니다." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FaceMarket" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="FaceMarket — 내 얼굴을 라이선스로" />
  <meta property="og:description" content="얼굴을 등록하고, 어떤 품목에 건당 얼마로 얼마 동안 쓸 수 있는지 직접 정합니다. 정한 조건은 누구나 확인할 수 있는 라이선스로 남습니다." />
  <meta property="og:image" content="https://facemarket.wearless.kr/assets/brand/temp-nav-logo.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="256" />
  <meta property="og:image:height" content="256" />
  <meta property="og:image:alt" content="FaceMarket 로고" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@300;400;500;600&family=Noto+Serif+KR:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/apps/facemarket/main.jsx"></script>
</body>
</html>
