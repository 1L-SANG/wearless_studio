# esbuild(admin 콘솔의 Tailwind v4 devDependency 사슬 — @tailwindcss/vite → vite → esbuild)의
# 설치 스크립트를 허용한다. 이걸 안 두면 설치가 `ERR_PNPM_IGNORED_BUILDS` 로 막힌다.
#
# package.json 의 "pnpm.onlyBuiltDependencies" 도 같은 의도로 남겨 뒀지만, 이 저장소에
# 깔린 pnpm(11.9.0)은 그 필드를 더 이상 읽지 않는다("[WARN] The pnpm field in package.json
# is no longer read by pnpm" — 직접 재현·확인함) — 그 버전대의 새 자리가 여기, 그리고 키
# 이름도 onlyBuiltDependencies 가 아니라 allowBuilds(패키지별 boolean 맵)로 바뀌었다.
# (pnpm 자신이 설치 실패 시 이 파일에 이 키를 스캐폴딩해 주는 것으로 확인함.)
#
# 이 파일은 예전엔 .gitignore 에 있었다 — 그래서 로컬에서 `pnpm approve-builds --all` 로
# 켠 승인이 저장소 diff 에 안 남고, CI·Vercel 의 클린 설치만 계속 이 에러를 맞았다. 지금은
# 추적 대상으로 옮겼다(.gitignore 에서 제거) — 이 설정 자체가 배포를 살리는 코드다.
allowBuilds:
  esbuild: true
