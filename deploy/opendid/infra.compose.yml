services:
  postgres-opendid:
    image: postgres:16.4
    container_name: postgre-opendid
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENDID_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${OPENDID_POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${OPENDID_POSTGRES_PASSWORD:-change-me-before-start}"
      POSTGRES_DB: "${OPENDID_POSTGRES_DB:-postgres}"
    volumes:
      - postgre_opendid_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  besu:
    image: docker.io/hyperledger/besu:25.5.0
    container_name: opendid-besu-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENDID_BESU_HTTP_PORT:-8545}:8545"
      - "127.0.0.1:${OPENDID_BESU_WS_PORT:-8546}:8546"
      - "127.0.0.1:${OPENDID_BESU_P2P_PORT:-30303}:30303"
      - "127.0.0.1:${OPENDID_BESU_P2P_PORT:-30303}:30303/udp"
    volumes:
      - besu_opendid_data:/opt/besu/data
    command: >
      --network=dev
      --data-path=/opt/besu/data
      --miner-enabled
      --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73
      --rpc-http-cors-origins=all
      --rpc-http-max-active-connections=10000
      --host-allowlist=*
      --rpc-ws-enabled
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-ws-host=0.0.0.0
      --min-gas-price=0
      --tx-pool-price-bump=0
    healthcheck:
      test: ["CMD-SHELL", "besu --version >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgre_opendid_data:
    name: postgre_opendid_data
  besu_opendid_data:
    name: besu_opendid_data
