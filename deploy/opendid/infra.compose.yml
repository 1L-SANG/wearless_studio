services:
  postgres-opendid:
    image: postgres:16.4
    container_name: postgre-opendid
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENDID_POSTGRES_PORT:?set OPENDID_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: "${OPENDID_POSTGRES_USER:?set OPENDID_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${OPENDID_POSTGRES_PASSWORD:?set OPENDID_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${OPENDID_POSTGRES_DB:?set OPENDID_POSTGRES_DB}"
    volumes:
      - postgre_opendid_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  besu:
    image: docker.io/hyperledger/besu:25.5.0
    container_name: opendid-besu-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENDID_BESU_HTTP_PORT:?set OPENDID_BESU_HTTP_PORT}:8545"
      - "127.0.0.1:${OPENDID_BESU_WS_PORT:?set OPENDID_BESU_WS_PORT}:8546"
      - "127.0.0.1:${OPENDID_BESU_P2P_PORT:?set OPENDID_BESU_P2P_PORT}:30303"
      - "127.0.0.1:${OPENDID_BESU_P2P_PORT:?set OPENDID_BESU_P2P_PORT}:30303/udp"
    volumes:
      - besu_opendid_data:/opt/besu/data
    command: >
      --network=dev
      --data-path=/opt/besu/data
      --miner-enabled
      --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73
      --rpc-http-cors-origins=all
      --rpc-http-max-active-connections=10000
      --host-allowlist=*
      --rpc-ws-enabled
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-ws-host=0.0.0.0
      --min-gas-price=0
      --tx-pool-price-bump=0
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /usr/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8545;
          printf "POST / HTTP/1.1\r\nHost: 127.0.0.1\r\nContent-Type: application/json\r\nContent-Length: 59\r\n\r\n{\"jsonrpc\":\"2.0\",\"method\":\"net_version\",\"params\":[],\"id\":1}" >&3;
          dd bs=4096 count=1 <&3 2>/dev/null | grep -q "\"result\""'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgre_opendid_data:
    name: "${OPENDID_POSTGRES_VOLUME:-postgre_opendid_data}"
  besu_opendid_data:
    name: "${OPENDID_BESU_VOLUME:-besu_opendid_data}"
