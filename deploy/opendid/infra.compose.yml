services:
  postgres:
    image: docker.io/library/postgres:16.4
    container_name: opendid-postgres
    restart: unless-stopped
    env_file:
      - /opt/opendid/secrets/TA/postgres.env
    environment:
      POSTGRES_DB: ${OPENDID_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${OPENDID_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${OPENDID_POSTGRES_PASSWORD:-replace-in-secret-env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - opendid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  besu:
    image: docker.io/hyperledger/besu:25.5.0
    container_name: opendid-besu
    restart: unless-stopped
    command: >
      --network=dev
      --data-path=/opt/besu/data
      --miner-enabled
      --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73
      --rpc-http-cors-origins=all
      --rpc-http-max-active-connections=10000
      --host-allowlist=*
      --rpc-ws-enabled
      --rpc-http-enabled
      --min-gas-price=0
      --tx-pool-price-bump=0
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
    volumes:
      - opendid_besu_data:/opt/besu/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 | grep -q '\"result\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  opendid_postgres_data:
    name: opendid_postgres_data
  opendid_besu_data:
    name: opendid_besu_data
